function initChessGame() {
    // --- State ---
    const game = new Chess();
    let selectedSq = null;       // currently selected square e.g. 'e2'
    let legalMoves = [];         // legal moves from selectedSq
    let timerWhite = 30;
    let timerBlack = 30;
    let timerInterval = null;
    let gameOver = false;
    let capturedByWhite = [];    // pieces white captured
    let capturedByBlack = [];    // pieces black captured

    // --- Unicode pieces (white/black) ---
    const PIECES = {
        wK: '♔', wQ: '♕', wR: '♖', wB: '♗', wN: '♘', wP: '♙',
        bK: '♚', bQ: '♛', bR: '♜', bB: '♝', bN: '♞', bP: '♟'
    };

    const pieceSymbol = (piece) => {
        if (!piece) return '';
        return PIECES[piece.color + piece.type.toUpperCase()] || '';
    };

    const files = ['a','b','c','d','e','f','g','h'];
    const ranks = ['8','7','6','5','4','3','2','1'];

    // --- DOM refs ---
    const boardEl = document.getElementById('chess-board');
    const timerWhiteEl = document.getElementById('chess-timer-white');
    const timerBlackEl = document.getElementById('chess-timer-black');
    const playerWhiteEl = document.getElementById('chess-player-white');
    const playerBlackEl = document.getElementById('chess-player-black');
    const moveLogEl = document.getElementById('chess-move-log');
    const overlayEl = document.getElementById('chess-overlay');
    const resultIconEl = document.getElementById('chess-result-icon');
    const resultTitleEl = document.getElementById('chess-result-title');
    const resultSubEl = document.getElementById('chess-result-sub');
    const capturedWhiteEl = document.getElementById('chess-captured-by-white');
    const capturedBlackEl = document.getElementById('chess-captured-by-black');

    if (!boardEl) return;

    // --- Square color ---
    function isLight(file, rank) {
        return (files.indexOf(file) + ranks.indexOf(rank)) % 2 !== 0;
    }

    // --- Render board ---
    function renderBoard() {
        boardEl.innerHTML = '';
        const inCheck = game.in_check();
        const turn = game.turn(); // 'w' or 'b'
        let kingInCheckSq = null;

        if (inCheck) {
            // find king square
            const board = game.board();
            outer: for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p && p.type === 'k' && p.color === turn) {
                        kingInCheckSq = files[c] + ranks[r];
                        break outer;
                    }
                }
            }
        }

        const legalDests = legalMoves.map(m => m.to);

        for (let ri = 0; ri < 8; ri++) {
            for (let fi = 0; fi < 8; fi++) {
                const sq = files[fi] + ranks[ri];
                const piece = game.get(sq);
                const light = isLight(files[fi], ranks[ri]);
                const isSelected = selectedSq === sq;
                const isLegal = legalDests.includes(sq);
                const isLastMove = game.history({ verbose: true }).slice(-1)[0];
                const isLastMoveHighlight = isLastMove && (isLastMove.from === sq || isLastMove.to === sq);
                const isKingCheck = sq === kingInCheckSq;

                let bg = light
                    ? 'bg-[#e8d5b0] hover:brightness-90'
                    : 'bg-[#6b3f2a] hover:brightness-110';

                if (isSelected) bg = 'bg-primary/80';
                else if (isKingCheck) bg = 'bg-danger/70';
                else if (isLastMoveHighlight) bg = light ? 'bg-[#cdd16d]' : 'bg-[#aaa23a]';

                const dot = isLegal
                    ? piece
                        ? `<div class="absolute inset-0 rounded border-4 border-black/30 pointer-events-none"></div>`
                        : `<div class="absolute inset-[30%] rounded-full bg-black/25 pointer-events-none"></div>`
                    : '';

                const pieceEl = piece
                    ? `<span class="text-[clamp(14px,3.5vw,32px)] leading-none drop-shadow-md pointer-events-none ${
                        piece.color === 'w'
                            ? 'text-white [text-shadow:0_1px_2px_rgba(0,0,0,0.9),0_0_4px_rgba(0,0,0,0.6)]'
                            : 'text-gray-900 [text-shadow:0_1px_2px_rgba(255,255,255,0.2)]'
                      }">${pieceSymbol(piece)}</span>`
                    : '';

                boardEl.innerHTML += `
                    <div data-sq="${sq}" class="relative flex items-center justify-center cursor-pointer transition-all duration-100 ${bg}">
                        ${dot}${pieceEl}
                    </div>`;
            }
        }

        // Attach click listeners
        boardEl.querySelectorAll('[data-sq]').forEach(el => {
            el.addEventListener('click', () => handleSquareClick(el.dataset.sq));
        });
    }

    // --- Handle square click ---
    function handleSquareClick(sq) {
        if (gameOver) return;

        const piece = game.get(sq);
        const turn = game.turn();

        // If a square is already selected
        if (selectedSq) {
            const targetMove = legalMoves.find(m => m.to === sq);
            if (targetMove) {
                // Handle pawn promotion
                const isPromotion = targetMove.flags.includes('p');
                const moveObj = { from: selectedSq, to: sq };
                if (isPromotion) moveObj.promotion = 'q'; // auto-promote to queen

                const move = game.move(moveObj);
                if (move) {
                    // Track captured pieces
                    if (move.captured) {
                        const cap = { type: move.captured, color: move.color === 'w' ? 'b' : 'w' };
                        if (move.color === 'w') capturedByWhite.push(cap);
                        else capturedByBlack.push(cap);
                    }
                    logMove(move);
                    selectedSq = null;
                    legalMoves = [];
                    renderBoard();
                    renderCaptured();
                    updatePlayerHighlight();
                    resetTimer();
                    checkGameOver();
                    return;
                }
            }
            // Clicked elsewhere or invalid → deselect or select new
            selectedSq = null;
            legalMoves = [];
        }

        // Select a piece belonging to current turn
        if (piece && piece.color === turn) {
            selectedSq = sq;
            legalMoves = game.moves({ square: sq, verbose: true });
        }

        renderBoard();
    }

    // --- Log move ---
    function logMove(move) {
        const moveNum = Math.ceil(game.history().length / 2);
        const color = move.color === 'w' ? 'White' : 'Black';
        const san = move.san;
        const div = document.createElement('div');
        div.className = 'flex gap-2 items-baseline py-0.5 border-b border-white/5';
        div.innerHTML = `
            <span class="text-gray-600 w-6 text-right flex-shrink-0">${moveNum}.</span>
            <span class="font-bold ${move.color === 'w' ? 'text-white' : 'text-gray-300'}">${color}</span>
            <span class="text-accent font-mono font-bold ml-auto">${san}</span>`;
        moveLogEl.appendChild(div);
        moveLogEl.scrollTop = moveLogEl.scrollHeight;
    }

    // --- Captured pieces display ---
    function renderCaptured() {
        capturedWhiteEl.innerHTML = capturedByWhite.map(p =>
            `<span class="text-xs leading-none text-gray-900 [text-shadow:0_1px_2px_rgba(255,255,255,0.3)]">${pieceSymbol({ color: 'b', type: p.type })}</span>`
        ).join('');
        capturedBlackEl.innerHTML = capturedByBlack.map(p =>
            `<span class="text-xs leading-none text-white [text-shadow:0_1px_2px_rgba(0,0,0,0.8)]">${pieceSymbol({ color: 'w', type: p.type })}</span>`
        ).join('');
    }

    // --- Active player highlight ---
    function updatePlayerHighlight() {
        const turn = game.turn();
        if (turn === 'w') {
            playerWhiteEl.classList.add('border-success', 'shadow-[0_0_20px_rgba(34,197,94,0.2)]');
            playerWhiteEl.classList.remove('border-border/30');
            playerBlackEl.classList.remove('border-success', 'shadow-[0_0_20px_rgba(34,197,94,0.2)]');
            playerBlackEl.classList.add('border-border/30');
            timerWhiteEl.classList.add('text-success');
            timerWhiteEl.classList.remove('text-gray-300');
            timerBlackEl.classList.remove('text-success');
            timerBlackEl.classList.add('text-gray-300');
        } else {
            playerBlackEl.classList.add('border-success', 'shadow-[0_0_20px_rgba(34,197,94,0.2)]');
            playerBlackEl.classList.remove('border-border/30');
            playerWhiteEl.classList.remove('border-success', 'shadow-[0_0_20px_rgba(34,197,94,0.2)]');
            playerWhiteEl.classList.add('border-border/30');
            timerBlackEl.classList.add('text-success');
            timerBlackEl.classList.remove('text-gray-300');
            timerWhiteEl.classList.remove('text-success');
            timerWhiteEl.classList.add('text-gray-300');
        }
    }

    // --- Timer logic ---
    function resetTimer() {
        clearInterval(timerInterval);
        timerWhite = timerWhite; // keep current
        timerBlack = timerBlack;
        if (gameOver) return;

        const turn = game.turn();
        // Reset timer for the player who just moved
        if (turn === 'b') { timerWhite = 30; timerWhiteEl.textContent = 30; timerWhiteEl.classList.remove('text-danger'); }
        else { timerBlack = 30; timerBlackEl.textContent = 30; timerBlackEl.classList.remove('text-danger'); }

        timerInterval = setInterval(() => {
            if (gameOver) { clearInterval(timerInterval); return; }
            const t = game.turn();
            if (t === 'w') {
                timerWhite--;
                timerWhiteEl.textContent = timerWhite;
                if (timerWhite <= 10) timerWhiteEl.classList.add('text-danger');
                if (timerWhite <= 0) { clearInterval(timerInterval); showGameOver('timeout', 'b'); }
            } else {
                timerBlack--;
                timerBlackEl.textContent = timerBlack;
                if (timerBlack <= 10) timerBlackEl.classList.add('text-danger');
                if (timerBlack <= 0) { clearInterval(timerInterval); showGameOver('timeout', 'w'); }
            }
        }, 1000);
    }

    // --- Game over check ---
    function checkGameOver() {
        if (game.in_checkmate()) {
            clearInterval(timerInterval);
            gameOver = true;
            const winner = game.turn() === 'w' ? 'b' : 'w';
            showGameOver('checkmate', winner);
        } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
            clearInterval(timerInterval);
            gameOver = true;
            showGameOver('draw', null);
        } else if (game.in_check()) {
            // Briefly flash the check state – board already shows danger highlight
        }
    }

    // --- Show game over overlay ---
    function showGameOver(reason, winner) {
        gameOver = true;
        clearInterval(timerInterval);
        overlayEl.classList.remove('hidden');

        const winnerName = winner === 'w' ? 'Player 1 (White)' : 'Player 2 (Black)';

        if (reason === 'checkmate') {
            resultIconEl.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl bg-warning/20 border-2 border-warning';
            resultIconEl.textContent = '♔';
            resultTitleEl.textContent = 'Checkmate!';
            resultSubEl.textContent = `${winnerName} wins by checkmate!`;
        } else if (reason === 'timeout') {
            resultIconEl.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl bg-danger/20 border-2 border-danger';
            resultIconEl.textContent = 'â±';
            resultTitleEl.textContent = 'Time Out!';
            resultSubEl.textContent = `${winnerName} wins on time!`;
        } else {
            resultIconEl.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl bg-primary/20 border-2 border-primary';
            resultIconEl.textContent = 'ðŸ¤';
            resultTitleEl.textContent = 'Draw!';
            resultSubEl.textContent = 'The game ended in a draw.';
        }
    }

    // --- Reset / New Game ---
    function newGame() {
        game.reset();
        selectedSq = null;
        legalMoves = [];
        timerWhite = 30;
        timerBlack = 30;
        gameOver = false;
        capturedByWhite = [];
        capturedByBlack = [];
        timerWhiteEl.textContent = 30;
        timerBlackEl.textContent = 30;
        timerWhiteEl.classList.remove('text-danger', 'text-gray-300');
        timerBlackEl.classList.remove('text-danger', 'text-success');
        moveLogEl.innerHTML = '<p class="text-gray-500 italic">Game started. White\'s turn.</p>';
        capturedWhiteEl.innerHTML = '';
        capturedBlackEl.innerHTML = '';
        overlayEl.classList.add('hidden');
        clearInterval(timerInterval);
        renderBoard();
        updatePlayerHighlight();
        resetTimer();
    }

    // --- Wire buttons ---
    document.getElementById('chess-reset-btn').addEventListener('click', newGame);
    document.getElementById('chess-play-again-btn').addEventListener('click', newGame);

    // --- Cleanup on navigation ---
    const chessObserver = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            mutation.removedNodes.forEach((node) => {
                if (node.contains && node.contains(boardEl)) {
                    clearInterval(timerInterval);
                    chessObserver.disconnect();
                }
            });
        });
    });
    const mainContent = document.getElementById('main-content');
    if (mainContent) chessObserver.observe(mainContent, { childList: true });

    // --- Initial render ---
    renderBoard();
    updatePlayerHighlight();
    resetTimer();
}

                                <p class="font-bold text-white text-sm leading-none">${players[0].name} <span class="text-primary text-xs">(You)</span></p>
                                <p class="text-gray-500 text-xs">White</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div id="ct-captured-white" class="flex flex-wrap gap-0.5 max-w-[100px] justify-end text-xs"></div>
                            <div id="ct-timer-white" class="font-mono font-black text-xl w-10 text-right text-white">30</div>
                        </div>
                    </div>
                </div>

                <!-- Right panel: Move log + status -->
                <div class="glass rounded-2xl p-4 border border-border/30 w-full lg:w-52 flex flex-col overflow-hidden max-h-48 lg:max-h-full">
                    <h3 class="font-bold text-white text-sm mb-2 flex items-center gap-2 flex-shrink-0">
                        <i data-lucide="scroll-text" class="w-4 h-4 text-primary"></i> Move Log
                    </h3>
                    <div id="ct-move-log" class="overflow-y-auto flex-1 space-y-0.5 custom-scrollbar text-xs">
                        <p class="text-gray-500 italic">Match started — Your move!</p>
                    </div>
                </div>
            </div>

            <!-- Game Over overlay -->
            <div id="ct-overlay" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center">
                <div class="glass p-8 md:p-12 rounded-3xl border border-border/50 text-center max-w-sm w-full mx-4 shadow-2xl">
                    <div id="ct-result-icon" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl"></div>
                    <h2 id="ct-result-title" class="text-4xl font-black text-white mb-2"></h2>
                    <p id="ct-result-sub" class="text-gray-400 mb-8"></p>
                    <button id="ct-continue-btn" class="w-full py-4 bg-primary text-white rounded-2xl font-bold text-lg hover:bg-blue-600 transition-colors shadow-lg shadow-primary/30"></button>
                </div>
            </div>
        </div>`;

        startChessTournamentMatch(isFinal);
    }

    // ── MATCH ENGINE ──────────────────────────────────────────
    function startChessTournamentMatch(isFinal) {
        const chess = new Chess();
        const PIECES = {
            wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',
            bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'
        };
        const files = ['a','b','c','d','e','f','g','h'];
        const ranks = ['8','7','6','5','4','3','2','1'];
        const sym = p => p ? (PIECES[p.color + p.type.toUpperCase()] || '') : '';

        const boardEl        = document.getElementById('ct-board');
        const timerWEl       = document.getElementById('ct-timer-white');
        const timerBEl       = document.getElementById('ct-timer-black');
        const playerWEl      = document.getElementById('ct-player-white');
        const playerBEl      = document.getElementById('ct-player-black');
        const logEl          = document.getElementById('ct-move-log');
        const overlayEl      = document.getElementById('ct-overlay');
        const resultIconEl   = document.getElementById('ct-result-icon');
        const resultTitleEl  = document.getElementById('ct-result-title');
        const resultSubEl    = document.getElementById('ct-result-sub');
        const continueBtnEl  = document.getElementById('ct-continue-btn');
        const capWEl         = document.getElementById('ct-captured-white');
        const capBEl         = document.getElementById('ct-captured-black');

        if (!boardEl) return;

        let selected   = null;
        let legal      = [];
        let twSec      = 30, tbSec = 30;
        let timerInt   = null;
        let over       = false;
        let cpuThinking = false;
        let capW = [], capB = [];

        // ── Board rendering ───────────────────────────────────
        function drawBoard() {
            boardEl.innerHTML = '';
            const inCheck  = chess.in_check();
            const turn     = chess.turn();
            let checkKing  = null;

            if (inCheck) {
                const b = chess.board();
                outer: for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
                    const p=b[r][c];
                    if (p && p.type==='k' && p.color===turn) { checkKing=files[c]+ranks[r]; break outer; }
                }
            }

            const legalDests = legal.map(m=>m.to);
            const lastMv = chess.history({verbose:true}).slice(-1)[0];

            for (let ri=0;ri<8;ri++) {
                for (let fi=0;fi<8;fi++) {
                    const sq    = files[fi]+ranks[ri];
                    const piece = chess.get(sq);
                    const light = (fi+ri)%2!==0;
                    const isSel = selected===sq;
                    const isLgl = legalDests.includes(sq);
                    const isLst = lastMv && (lastMv.from===sq||lastMv.to===sq);
                    const isCk  = sq===checkKing;

                    let bg = light ? 'bg-[#e8d5b0]' : 'bg-[#6b3f2a]';
                    if (isSel)      bg = 'bg-primary/80';
                    else if (isCk)  bg = 'bg-danger/70';
                    else if (isLst) bg = light ? 'bg-[#cdd16d]' : 'bg-[#aaa23a]';

                    const dot = isLgl
                        ? (piece
                            ? `<div class="absolute inset-0 border-4 border-black/30 pointer-events-none rounded"></div>`
                            : `<div class="absolute inset-[30%] rounded-full bg-black/25 pointer-events-none"></div>`)
                        : '';

                    const pieceSpan = piece
                        ? `<span class="text-[clamp(12px,3vw,30px)] leading-none pointer-events-none ${
                            piece.color==='w'
                                ? 'text-white [text-shadow:0_1px_3px_rgba(0,0,0,1)]'
                                : 'text-gray-900 [text-shadow:0_1px_2px_rgba(255,255,255,0.2)]'
                          }">${sym(piece)}</span>`
                        : '';

                    boardEl.innerHTML += `<div data-sq="${sq}" class="relative flex items-center justify-center cursor-pointer ${bg} hover:brightness-90 transition-all duration-75">${dot}${pieceSpan}</div>`;
                }
            }
            boardEl.querySelectorAll('[data-sq]').forEach(el => el.addEventListener('click', () => onSquareClick(el.dataset.sq)));
        }

        // ── Square click (human White) ────────────────────────
        function onSquareClick(sq) {
            if (over || chess.turn()==='b' || cpuThinking) return;
            const piece = chess.get(sq);

            if (selected) {
                const mv = legal.find(m=>m.to===sq);
                if (mv) {
                    const mObj = {from:selected, to:sq};
                    if (mv.flags.includes('p')) mObj.promotion='q';
                    const m = chess.move(mObj);
                    if (m) {
                        if (m.captured) capW.push({type:m.captured});
                        logMove(m);
                        selected=null; legal=[];
                        drawBoard(); renderCap();
                        highlight('w'); resetTimer();
                        if (!checkEnd()) scheduleCPU();
                        return;
                    }
                }
                selected=null; legal=[];
            }
            if (piece && piece.color==='w') {
                selected=sq;
                legal=chess.moves({square:sq,verbose:true});
            }
            drawBoard();
        }

        // ── CPU move (Black) ──────────────────────────────────
        function scheduleCPU() {
            if (over || chess.turn()==='w') return;
            cpuThinking = true;
            const delay = 700 + Math.random()*800;
            setTimeout(() => {
                if (over || chess.turn()==='w') { cpuThinking=false; return; }
                const moves = chess.moves({verbose:true});
                if (!moves.length) { cpuThinking=false; checkEnd(); return; }

                // Slightly smart: prefer captures > checks > random
                const captureMoves = moves.filter(m=>m.flags.includes('c')||m.flags.includes('e'));
                const checkMoves   = moves.filter(m=>m.san.includes('+'));
                let pick;
                if (checkMoves.length && Math.random()<0.6)   pick=checkMoves[Math.floor(Math.random()*checkMoves.length)];
                else if (captureMoves.length && Math.random()<0.5) pick=captureMoves[Math.floor(Math.random()*captureMoves.length)];
                else pick=moves[Math.floor(Math.random()*moves.length)];

                const m = chess.move({from:pick.from, to:pick.to, promotion:'q'});
                if (m) {
                    if (m.captured) capB.push({type:m.captured});
                    logMove(m);
                    drawBoard(); renderCap();
                    highlight('b'); resetTimer();
                    checkEnd();
                }
                cpuThinking=false;
            }, delay);
        }

        // ── Log ───────────────────────────────────────────────
        function logMove(m) {
            const num  = Math.ceil(chess.history().length/2);
            const who  = m.color==='w' ? '<span class="text-white font-bold">You</span>' : `<span class="text-gray-300 font-bold">CPU</span>`;
            const row  = document.createElement('div');
            row.className='flex gap-2 items-baseline py-0.5 border-b border-white/5';
            row.innerHTML=`<span class="text-gray-600 w-5 text-right flex-shrink-0">${num}.</span>${who}<span class="text-accent font-mono font-bold ml-auto">${m.san}</span>`;
            logEl.appendChild(row);
            logEl.scrollTop=logEl.scrollHeight;
        }

        // ── Captured display ──────────────────────────────────
        function renderCap() {
            capWEl.innerHTML = capW.map(p=>`<span>${sym({color:'b',type:p.type})}</span>`).join('');
            capBEl.innerHTML = capB.map(p=>`<span>${sym({color:'w',type:p.type})}</span>`).join('');
        }

        // ── Active player highlight ───────────────────────────
        function highlight(turn) {
            if (turn==='w') {
                playerWEl.classList.add('border-success','shadow-[0_0_16px_rgba(34,197,94,0.2)]');
                playerWEl.classList.remove('border-border/30');
                playerBEl.classList.remove('border-success','shadow-[0_0_16px_rgba(34,197,94,0.2)]');
                playerBEl.classList.add('border-border/30');
                timerWEl.classList.add('text-success'); timerWEl.classList.remove('text-gray-400');
                timerBEl.classList.remove('text-success'); timerBEl.classList.add('text-gray-400');
            } else {
                playerBEl.classList.add('border-danger','shadow-[0_0_16px_rgba(239,68,68,0.15)]');
                playerBEl.classList.remove('border-border/30');
                playerWEl.classList.remove('border-success','shadow-[0_0_16px_rgba(34,197,94,0.2)]');
                playerWEl.classList.add('border-border/30');
                timerBEl.classList.add('text-danger'); timerBEl.classList.remove('text-gray-400');
                timerWEl.classList.remove('text-success'); timerWEl.classList.add('text-gray-400');
            }
        }

        // ── 30-second timer ───────────────────────────────────
        function resetTimer() {
            clearInterval(timerInt);
            if (over) return;
            const t = chess.turn();
            if (t==='b') { twSec=30; timerWEl.textContent=30; timerWEl.classList.remove('text-danger'); }
            else          { tbSec=30; timerBEl.textContent=30; timerBEl.classList.remove('text-danger'); }

            timerInt = setInterval(()=>{
                if (over) { clearInterval(timerInt); return; }
                const cur = chess.turn();
                if (cur==='w') {
                    twSec--;
                    timerWEl.textContent=twSec;
                    if (twSec<=10) timerWEl.classList.add('text-danger');
                    if (twSec<=0)  { clearInterval(timerInt); endMatch('timeout','b'); }
                } else {
                    tbSec--;
                    timerBEl.textContent=tbSec;
                    if (tbSec<=10) timerBEl.classList.add('text-danger');
                    if (tbSec<=0)  { clearInterval(timerInt); endMatch('timeout','w'); }
                }
            },1000);
        }

        // ── Check game end ────────────────────────────────────
        function checkEnd() {
            if (chess.in_checkmate()) { clearInterval(timerInt); over=true; const w=chess.turn()==='w'?'b':'w'; endMatch('checkmate',w); return true; }
            if (chess.in_draw()||chess.in_stalemate()||chess.in_threefold_repetition()) { clearInterval(timerInt); over=true; endMatch('draw',null); return true; }
            return false;
        }

        // ── Show overlay ──────────────────────────────────────
        function endMatch(reason, winner) {
            over = true; clearInterval(timerInt);
            const humanWon = winner==='w';
            overlayEl.classList.remove('hidden');

            if (reason==='draw') {
                resultIconEl.className='w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl bg-primary/20 border-2 border-primary';
                resultIconEl.textContent='ðŸ¤';
                resultTitleEl.textContent='Draw!';
                resultSubEl.textContent='The match ended in a draw. You are eliminated.';
                continueBtnEl.textContent='Exit Tournament';
                continueBtnEl.onclick=()=>{ state='ELIMINATED'; render(); };
            } else if (humanWon) {
                resultIconEl.className='w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl bg-success/20 border-2 border-success';
                resultIconEl.textContent='♔';
                if (isFinal) {
                    resultTitleEl.textContent='Champion!';
                    resultSubEl.textContent='You won the Grand Final! ðŸ†';
                    continueBtnEl.textContent='Claim Prize $1,000';
                    continueBtnEl.onclick=()=>{ state='CHAMPION'; render(); };
                } else {
                    resultTitleEl.textContent='You Win!';
                    resultSubEl.textContent=`${myOpponent.name} has been eliminated. Advancing to Final...`;
                    continueBtnEl.textContent='Continue to Final';
                    continueBtnEl.onclick=()=>{ state='WAITING'; render(); };
                }
            } else {
                resultIconEl.className='w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 text-4xl bg-danger/20 border-2 border-danger';
                resultIconEl.textContent=reason==='timeout'?'â±':'♚';
                resultTitleEl.textContent=reason==='timeout'?'Time Out!':'Checkmate!';
                resultSubEl.textContent=`${myOpponent.name} wins. Better luck next time!`;
                continueBtnEl.textContent='Exit Tournament';
                continueBtnEl.onclick=()=>{ state='ELIMINATED'; render(); };
            }
        }

        // ── Cleanup observer ──────────────────────────────────
        const obs = new MutationObserver(muts=>{
            muts.forEach(m=>{
                m.removedNodes.forEach(n=>{
                    if (n.contains && n.contains(boardEl)) {
                        clearInterval(timerInt); obs.disconnect();
                    }
                });
            });
        });
        const mc = document.getElementById('ct-container');
        if (mc) obs.observe(mc,{childList:true});

        // ── Initial draw ──────────────────────────────────────
        drawBoard();
        highlight('w');
        resetTimer();
    }

    // ── WAITING ROOM ──────────────────────────────────────────
    function renderWaiting() {
        const otherMatch = `${sfMatchups[1][0].name} vs ${sfMatchups[1][1].name}`;
        container.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full max-w-xl mx-auto text-center animate-fade-in gap-6">
            <div class="relative">
                <i data-lucide="clock" class="w-16 h-16 text-primary animate-pulse"></i>
            </div>
            <h2 class="text-4xl font-black text-white">Waiting Room</h2>
            <p class="text-gray-400 text-lg">Waiting for the other Semi-Final to finish...</p>
            <div class="glass rounded-2xl p-4 border border-border/30 w-full max-w-xs">
                <p class="text-xs text-gray-500 uppercase tracking-widest mb-2">Other Match</p>
                <p class="text-white font-bold">${otherMatch}</p>
                <p class="text-gray-500 text-sm mt-1">In Progress <span class="animate-pulse">â€¢</span></p>
            </div>
            <div class="w-64 h-2 bg-border rounded-full overflow-hidden">
                <div class="h-full bg-primary rounded-full animate-pulse w-full"></div>
            </div>
        </div>`;

        // Simulate other SF finishing after 3 seconds
        setTimeout(() => {
            // Shroud beats Ninja (or random) — Shroud advances to Final
            const finalist = sfMatchups[1][0]; // Shroud
            myOpponent = finalist;
            finalMatchup = [players[0], finalist];
            state = 'FINAL_LOBBY';
            render();
        }, 3500);
    }

    // ── FINAL LOBBY ───────────────────────────────────────────
    function renderFinalLobby() {
        container.innerHTML = `
        <div class="flex flex-col items-center max-w-3xl mx-auto w-full py-6 animate-fade-in">
            <div class="relative mb-4">
                <div class="absolute inset-0 bg-warning blur-2xl opacity-20 rounded-full animate-pulse"></div>
                <i data-lucide="trophy" class="w-16 h-16 text-warning relative z-10"></i>
            </div>
            <h1 class="text-4xl font-black text-white mb-1">Grand Final</h1>
            <p class="text-warning font-bold text-lg mb-10">Only 2 Players Remain!</p>

            <div class="w-full mb-10">
                ${bracketCard(finalMatchup[0], finalMatchup[1], true)}
            </div>

            <div class="glass rounded-2xl p-4 border border-warning/30 shadow-[0_0_24px_rgba(245,158,11,0.12)] w-full mb-10 text-sm text-gray-400 text-center">
                <p class="text-warning font-bold mb-1">Prize: <span class="text-success text-lg font-black">$1,000</span></p>
                <p>Win by checkmate or opponent timeout. Good luck!</p>
            </div>

            <button id="ct-final-btn" class="px-12 py-4 bg-warning text-black text-lg rounded-2xl font-black hover:bg-yellow-400 transition-all shadow-[0_0_30px_rgba(245,158,11,0.4)] hover:scale-105 active:scale-95 flex items-center gap-3">
                <i data-lucide="crown" class="w-6 h-6"></i> Enter Grand Final
            </button>
        </div>`;
        document.getElementById('ct-final-btn').onclick = () => { state='FINAL'; render(); };
    }

    // ── ELIMINATED ────────────────────────────────────────────
    function renderEliminated() {
        container.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full max-w-lg mx-auto text-center animate-fade-in gap-6">
            <div class="w-24 h-24 rounded-full bg-danger/20 border-4 border-danger flex items-center justify-center text-5xl">♚</div>
            <h2 class="text-5xl font-black text-white">Eliminated</h2>
            <p class="text-gray-400 text-lg">You were knocked out of the tournament.</p>
            <a href="#tournaments" class="px-8 py-3 bg-card border border-border text-white rounded-xl font-bold hover:bg-white/5 transition-colors">
                Back to Tournaments
            </a>
        </div>`;
    }

    // ── CHAMPION ──────────────────────────────────────────────
    function renderChampion() {
        mockData.wallet.available += 1000;
        mockData.wallet.winning   += 1000;
        container.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full max-w-3xl mx-auto text-center animate-fade-in gap-6">
            <div class="relative">
                <div class="absolute inset-0 bg-warning blur-3xl opacity-30 animate-pulse rounded-full"></div>
                <i data-lucide="crown" class="w-28 h-28 text-warning relative z-10"></i>
            </div>
            <h2 class="text-5xl md:text-6xl font-black text-white tracking-tighter">CHAMPION!</h2>
            <p class="text-2xl text-warning font-bold">Chess Masters Tournament Winner</p>

            <div class="glass p-6 rounded-3xl flex items-center gap-6 border-2 border-warning shadow-[0_0_40px_rgba(245,158,11,0.2)]">
                <div class="text-left">
                    <p class="text-gray-400 font-bold uppercase tracking-widest text-xs mb-1">Prize Awarded</p>
                    <p class="text-4xl font-black text-success">+$1,000.00</p>
                </div>
                <i data-lucide="coins" class="w-12 h-12 text-success flex-shrink-0"></i>
            </div>

            <a href="#dashboard" class="px-10 py-4 bg-warning text-black text-lg rounded-2xl font-black hover:bg-yellow-400 transition-all shadow-[0_0_30px_rgba(245,158,11,0.4)]">
                Claim Prize & Go to Dashboard
            </a>
        </div>`;
    }

    render();
}

</script>
<script>
// ============================================================
// SultanPro Phone OTP Authentication — Supabase Auth
// Replace BOTH values below with your Supabase project credentials.
// Supabase Dashboard -> Project Settings -> API
// Also enable Authentication -> Providers -> Phone and configure an SMS provider.
// ============================================================
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const PhoneAuth = {
    client: null,
    session: null,
    pendingPhone: '',

    configured() {
        return SUPABASE_URL.startsWith('https://') &&
               !SUPABASE_URL.includes('YOUR_SUPABASE') &&
               SUPABASE_ANON_KEY &&
               !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE');
    },

    initClient() {
        if (!this.configured() || !window.supabase) return false;
        if (!this.client) this.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return true;
    },

    async boot() {
        this.renderGate();
        if (!this.initClient()) {
            this.showSetupState();
            return;
        }
        const { data } = await this.client.auth.getSession();
        this.session = data?.session || null;
        if (this.session) {
            this.onAuthenticated(this.session);
        } else {
            this.showPhoneStep();
        }
        this.client.auth.onAuthStateChange((_event, session) => {
            this.session = session;
            if (session) this.onAuthenticated(session);
        });
    },

    renderGate() {
        if (document.getElementById('phone-auth-gate')) return;
        const gate = document.createElement('div');
        gate.id = 'phone-auth-gate';
        gate.className = 'fixed inset-0 z-[9999] flex items-center justify-center p-4';
        gate.style.background = 'radial-gradient(circle at top,rgba(37,99,235,.18),transparent 35%),#0F172A';
        gate.innerHTML = `
          <div class="w-full max-w-md rounded-3xl p-6 md:p-8" style="background:rgba(30,41,59,.96);border:1px solid rgba(71,85,105,.7);box-shadow:0 30px 80px rgba(0,0,0,.45);">
            <div class="flex items-center gap-3 mb-7">
              <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#2563EB,#00C2A8);">
                <i data-lucide="gamepad-2" class="w-6 h-6 text-white"></i>
              </div>
              <div><h1 class="text-2xl font-black text-white">SultanPro</h1><p class="text-xs text-gray-400">Secure phone verification</p></div>
            </div>
            <div id="phone-auth-body"></div>
          </div>`;
        document.body.appendChild(gate);
        if (window.lucide) lucide.createIcons();
    },

    showSetupState() {
        const body = document.getElementById('phone-auth-body');
        if (!body) return;
        body.innerHTML = `
          <div class="rounded-2xl p-4 mb-5" style="background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);">
            <p class="font-bold mb-1" style="color:#F59E0B;">SMS setup required</p>
            <p class="text-sm text-gray-300 leading-6">Add your Supabase project URL and anon key inside this index file, then enable <b>Phone Auth</b> and connect an SMS provider in Supabase. Until then, no real SMS can be sent.</p>
          </div>
          <button onclick="PhoneAuth.enterSetupPreview()" class="w-full py-3 rounded-xl font-bold text-white" style="background:#334155;">Preview Dashboard</button>`;
    },

    showPhoneStep(message='') {
        const body = document.getElementById('phone-auth-body');
        if (!body) return;
        body.innerHTML = `
          <h2 class="text-2xl font-black text-white mb-2">Login with phone</h2>
          <p class="text-gray-400 text-sm mb-6">Enter your number in international format, for example <b class="text-gray-200">+923001234567</b>.</p>
          ${message ? `<div class="mb-4 text-sm rounded-xl p-3" style="background:rgba(239,68,68,.1);color:#FCA5A5;border:1px solid rgba(239,68,68,.25);">${message}</div>` : ''}
          <label class="block text-sm font-semibold text-gray-300 mb-2">Phone number</label>
          <div class="relative mb-4">
            <i data-lucide="phone" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
            <input id="auth-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+923001234567" class="w-full pl-12 pr-4 py-3.5 rounded-xl text-white outline-none" style="background:#0F172A;border:1px solid #334155;">
          </div>
          <button id="send-otp-btn" onclick="PhoneAuth.sendOTP()" class="w-full py-3.5 rounded-xl font-bold text-white" style="background:linear-gradient(135deg,#2563EB,#1D4ED8);">Send SMS Code</button>
          <p class="text-xs text-gray-500 text-center mt-4">Standard SMS charges may apply.</p>`;
        if (window.lucide) lucide.createIcons();
    },

    showOtpStep(message='') {
        const body = document.getElementById('phone-auth-body');
        if (!body) return;
        const masked = this.pendingPhone.length > 5 ? this.pendingPhone.slice(0,4)+'••••'+this.pendingPhone.slice(-3) : this.pendingPhone;
        body.innerHTML = `
          <h2 class="text-2xl font-black text-white mb-2">Enter verification code</h2>
          <p class="text-gray-400 text-sm mb-6">We sent a 6-digit SMS code to <b class="text-white">${masked}</b>.</p>
          ${message ? `<div class="mb-4 text-sm rounded-xl p-3" style="background:rgba(239,68,68,.1);color:#FCA5A5;border:1px solid rgba(239,68,68,.25);">${message}</div>` : ''}
          <label class="block text-sm font-semibold text-gray-300 mb-2">6-digit code</label>
          <input id="auth-otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" class="w-full px-4 py-4 rounded-xl text-white text-center text-2xl tracking-[.45em] font-black outline-none mb-4" style="background:#0F172A;border:1px solid #334155;">
          <button id="verify-otp-btn" onclick="PhoneAuth.verifyOTP()" class="w-full py-3.5 rounded-xl font-bold text-white" style="background:linear-gradient(135deg,#00C2A8,#059669);">Verify & Enter Dashboard</button>
          <button onclick="PhoneAuth.showPhoneStep()" class="w-full py-3 mt-2 text-sm font-semibold text-gray-400 hover:text-white">Change phone number</button>`;
        setTimeout(()=>document.getElementById('auth-otp')?.focus(),50);
    },

    normalizePhone(raw) {
        return String(raw || '').replace(/[\s()\-]/g,'');
    },

    async sendOTP() {
        const input = document.getElementById('auth-phone');
        const phone = this.normalizePhone(input?.value);
        if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
            this.showPhoneStep('Use international format beginning with + and country code.');
            return;
        }
        const btn = document.getElementById('send-otp-btn');
        if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }
        const { error } = await this.client.auth.signInWithOtp({ phone });
        if (error) {
            this.showPhoneStep(error.message || 'Could not send SMS. Check your SMS provider settings.');
            return;
        }
        this.pendingPhone = phone;
        this.showOtpStep();
    },

    async verifyOTP() {
        const token = String(document.getElementById('auth-otp')?.value || '').trim();
        if (!/^\d{6}$/.test(token)) {
            this.showOtpStep('Enter the complete 6-digit verification code.');
            return;
        }
        const btn = document.getElementById('verify-otp-btn');
        if (btn) { btn.disabled = true; btn.textContent = 'Verifying...'; }
        const { data, error } = await this.client.auth.verifyOtp({ phone: this.pendingPhone, token, type: 'sms' });
        if (error || !data?.session) {
            this.showOtpStep(error?.message || 'Invalid or expired code. Please try again.');
            return;
        }
        this.onAuthenticated(data.session);
    },

    onAuthenticated(session) {
        this.session = session;
        const phone = session?.user?.phone || 'Verified user';
        mockData.user.username = phone;
        const gate = document.getElementById('phone-auth-gate');
        if (gate) gate.remove();
        if (!window.__sultanAppStarted) {
            window.__sultanAppStarted = true;
            app.init();
        } else {
            app.refreshAccountUI?.();
        }
    },

    enterSetupPreview() {
        const gate = document.getElementById('phone-auth-gate');
        if (gate) gate.remove();
        if (!window.__sultanAppStarted) {
            window.__sultanAppStarted = true;
            app.init();
        }
    },

    async logout() {
        if (this.client) await this.client.auth.signOut();
        this.session = null;
        window.location.hash = '#dashboard';
        this.renderGate();
        this.configured() ? this.showPhoneStep() : this.showSetupState();
    },

    updateAccountPage() {
        const card = document.getElementById('account-status-card');
        if (!card) return;
        if (this.session?.user) {
            card.innerHTML = `<p class="text-xs text-gray-500 mb-1">Signed in as</p><p class="font-bold text-white">${this.session.user.phone || this.session.user.id}</p><p class="text-xs mt-2" style="color:#22C55E;">✓ Phone verified</p>`;
        } else {
            card.innerHTML = `<p class="text-sm text-gray-400">You are not currently signed in with a verified phone number.</p>`;
        }
    }
};
</script>

<script>
// js/app.js


function initSultan3DArena(){
  const canvas=document.getElementById('sultan-3d-arena');
  if(!canvas || !window.THREE) return;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,1,.1,100);
  camera.position.set(0,1.8,9);
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const resize=()=>{const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();};
  resize(); window.addEventListener('resize',resize,{passive:true});
  scene.add(new THREE.AmbientLight(0x8fb7ff,1.5));
  const key=new THREE.PointLight(0x2563eb,30,20);key.position.set(3,5,5);scene.add(key);
  const rim=new THREE.PointLight(0x00c2a8,24,20);rim.position.set(-4,2,-2);scene.add(rim);
  const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.35,2),new THREE.MeshStandardMaterial({color:0x2563eb,metalness:.75,roughness:.18,emissive:0x0b2d7a,emissiveIntensity:.65}));
  core.position.set(1.1,.1,0);scene.add(core);
  const ringMat=new THREE.MeshBasicMaterial({color:0x00c2a8,transparent:true,opacity:.5,wireframe:true});
  const rings=[];
  [1.8,2.25,2.7].forEach((s,i)=>{const g=new THREE.TorusGeometry(s,.018,8,96);const m=new THREE.Mesh(g,ringMat.clone());m.rotation.x=i*.48;scene.add(m);rings.push(m);});
  const nodes=[];
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const n=new THREE.Mesh(new THREE.SphereGeometry(.12,16,16),new THREE.MeshBasicMaterial({color:i%2?0x00c2a8:0x60a5fa}));n.position.set(2.8*Math.cos(a),.2+0.65*Math.sin(a*2),2.8*Math.sin(a));scene.add(n);nodes.push({n,a});}
  const stars=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0x7dd3fc,size:.025,transparent:true,opacity:.5}));
  const arr=new Float32Array(900);for(let i=0;i<arr.length;i++)arr[i]=(Math.random()-.5)*22;stars.geometry.setAttribute('position',new THREE.BufferAttribute(arr,3));scene.add(stars);
  let t=0;
  function animate(){requestAnimationFrame(animate);t+=.008;core.rotation.x+=.004;core.rotation.y+=.008;rings.forEach((r,i)=>{r.rotation.z+=.002+i*.001;r.rotation.y+=.003});nodes.forEach((o,i)=>{o.a+=.003*(i%2?1:-1);o.n.position.x=2.8*Math.cos(o.a);o.n.position.z=2.8*Math.sin(o.a);o.n.position.y=.2+.65*Math.sin(o.a*2+t)});stars.rotation.y+=.00015;camera.lookAt(.4,.1,0);renderer.render(scene,camera);}
  animate();
}
function selectMatchMode(el){el.parentElement.querySelectorAll('.sp-mode-card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');}

const app = {
    init: () => {
        // Remove loading spinner
        const loading = document.getElementById('app-loading');
        if (loading) loading.remove();

        // Inject layout
        document.getElementById('sidebar-container').innerHTML = Components.Sidebar();
        document.getElementById('header-container').innerHTML  = Components.Header();

        // Initialize icons immediately after injection
        if (window.lucide) lucide.createIcons();

        // Setup hash-based routing
        window.addEventListener('hashchange', app.route);

        // Initial route
        if (!window.location.hash || window.location.hash === '#') {
            window.location.hash = '#dashboard';
        } else {
            app.route();
        }
    },

    route: () => {
        const hash        = window.location.hash.replace('#', '') || 'dashboard';
        const mainContent = document.getElementById('main-content');

        // Render page
        if (Pages[hash]) {
            mainContent.innerHTML = Pages[hash]();
        } else {
            mainContent.innerHTML = Pages.notFound();
        }

        // Scroll to top on navigation
        mainContent.scrollTop = 0;

        // Update active nav link
        app.setActiveLink(hash);

        // Re-initialize Lucide icons for newly injected HTML
        if (window.lucide) {
            lucide.createIcons();
        }

        if (hash === 'login') {
            setTimeout(() => PhoneAuth.updateAccountPage(), 0);
        }

        // Close mobile sidebar on route change
        const sidebar = document.getElementById('sidebar');
        if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
            sidebar.classList.add('-translate-x-full');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (backdrop) backdrop.classList.add('hidden');
        }
    },

    setActiveLink: (hash) => {
        document.querySelectorAll('.nav-link').forEach(link => {
            const linkHref = link.getAttribute('data-href') || link.getAttribute('href') || '';
            const linkHash = linkHref.replace('#', '');

            if (linkHash === hash) {
                // Active styles
                link.style.background    = 'rgba(37,99,235,0.20)';
                link.style.color         = '#ffffff';
                link.style.borderRight   = '2px solid #2563EB';
                link.style.borderRadius  = '12px';
            } else {
                // Inactive styles
                link.style.background    = '';
                link.style.color         = '';
                link.style.borderRight   = '2px solid transparent';
                link.style.borderRadius  = '12px';
            }
        });
    },

    toggleSidebar: () => {
        const sidebar  = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        if (!sidebar) return;

        if (sidebar.classList.contains('-translate-x-full')) {
            sidebar.classList.remove('-translate-x-full');
            if (backdrop) backdrop.classList.remove('hidden');
        } else {
            sidebar.classList.add('-translate-x-full');
            if (backdrop) backdrop.classList.add('hidden');
        }
    }
};

// Initialize app when DOM is ready
document.addEventListener('DOMContentLoaded', () => {
    PhoneAuth.boot();
});

</script>
