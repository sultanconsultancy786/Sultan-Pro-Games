/* ============================================================
   SultanPro — Global Styles (Compatible with Tailwind CDN)
   ============================================================ */

/* Base */
*, *::before, *::after { box-sizing: border-box; }

body {
    background-color: #0F172A;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

/* ── Glass utility (replaces @layer which breaks on CDN) ─── */
.glass {
    background-color: rgba(30, 41, 59, 0.80);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(51, 65, 85, 0.50);
}

.glass-panel {
    background-color: rgba(15, 23, 42, 0.60);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(51, 65, 85, 0.50);
}

/* ── Custom Scrollbar ─────────────────────────────────────── */
.custom-scrollbar::-webkit-scrollbar        { width: 6px; height: 6px; }
.custom-scrollbar::-webkit-scrollbar-track  { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb  { background-color: #334155; border-radius: 20px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #475569; }

/* ── Animations ───────────────────────────────────────────── */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-10px); }
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .5; }
}

.animate-fade-in             { animation: fadeIn 0.4s ease-out forwards; }
.animate-fade-in-delay-1     { animation: fadeIn 0.4s ease-out 0.1s forwards; opacity: 0; }
.animate-fade-in-delay-2     { animation: fadeIn 0.4s ease-out 0.2s forwards; opacity: 0; }
.animate-fade-in-delay-3     { animation: fadeIn 0.4s ease-out 0.3s forwards; opacity: 0; }
.animate-spin                { animation: spin 1s linear infinite; }
.animate-bounce              { animation: bounce 1s ease-in-out infinite; }
.animate-pulse               { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }

/* ── Page Transition ──────────────────────────────────────── */
.page-transition  { transition: opacity 0.3s ease, transform 0.3s ease; }
.page-enter       { opacity: 0; transform: translateY(20px); }
.page-enter-active{ opacity: 1; transform: translateY(0); }

/* ── Mobile Sidebar ───────────────────────────────────────── */
#sidebar-container > div { transition: transform 0.3s ease-in-out; }

/* ── Sidebar active link ──────────────────────────────────── */
.nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 12px;
    color: #9CA3AF;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    transition: all 0.2s ease;
    border-right: 2px solid transparent;
}
.nav-link:hover {
    color: #ffffff;
    background-color: rgba(255,255,255,0.05);
}
.nav-link.active {
    background-color: rgba(37, 99, 235, 0.20);
    color: #ffffff;
    border-right-color: #2563EB;
}

/* ── Utility overrides ────────────────────────────────────── */
.touch-manipulation { touch-action: manipulation; }
.pointer-events-none { pointer-events: none; }
.select-none { user-select: none; }
.whitespace-nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appearance-none { appearance: none; }
.outline-none { outline: none; }
.antialiased { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

/* ── Chart canvas ─────────────────────────────────────────── */
canvas { display: block; }

/* ── Responsive overflow for tables ──────────────────────── */
.overflow-x-auto { overflow-x: auto; }


/* ================= SULTANPRO 3D ARENA UPGRADE ================= */
:root{--sp-blue:#2563EB;--sp-cyan:#00C2A8;--sp-purple:#8B5CF6;--sp-gold:#F59E0B}
body{background:
 radial-gradient(900px 500px at 80% -10%,rgba(37,99,235,.16),transparent 60%),
 radial-gradient(700px 500px at 10% 100%,rgba(0,194,168,.10),transparent 60%),
 #070d18!important}
#main-content{perspective:1200px}
.sp-3d-shell{position:relative;min-height:390px;border-radius:28px;overflow:hidden;
 background:linear-gradient(145deg,rgba(15,23,42,.96),rgba(9,18,35,.80));
 border:1px solid rgba(96,165,250,.22);box-shadow:0 25px 80px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.06)}
.sp-3d-shell:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(37,99,235,.12),transparent 28%,rgba(0,194,168,.10),transparent 55%);animation:spOrbit 12s linear infinite}
@keyframes spOrbit{to{transform:rotate(360deg)}}
.sp-3d-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.sp-3d-ui{position:relative;z-index:3;padding:28px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.sp-glass{background:rgba(15,23,42,.58);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.15);box-shadow:0 12px 35px rgba(0,0,0,.18)}
.sp-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(37,99,235,.12);border:1px solid rgba(96,165,250,.2);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sp-orbit-card{position:absolute;z-index:3;right:24px;bottom:22px;width:235px;padding:16px;border-radius:18px}
.sp-hero-title{font-size:clamp(28px,4vw,50px);line-height:.98;font-weight:950;letter-spacing:-.04em;max-width:520px}
.sp-gradient-text{background:linear-gradient(90deg,#fff,#93c5fd,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-action{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 17px;font-weight:900;transition:.25s;cursor:pointer}
.sp-action:hover{transform:translateY(-2px) scale(1.01)}
.sp-action-primary{background:linear-gradient(135deg,#2563EB,#4F46E5);color:white;box-shadow:0 10px 28px rgba(37,99,235,.28)}
.sp-action-cyan{background:linear-gradient(135deg,#00C2A8,#059669);color:white;box-shadow:0 10px 28px rgba(0,194,168,.20)}
.sp-action-dark{background:rgba(30,41,59,.75);border:1px solid rgba(148,163,184,.16);color:#e5e7eb}
.sp-3d-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.sp-depth{transform-style:preserve-3d;transition:transform .3s,box-shadow .3s}
.sp-depth:hover{transform:translateY(-5px) rotateX(2deg) rotateY(-2deg);box-shadow:0 20px 45px rgba(0,0,0,.28)}
.sp-bracket-3d{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:center}
.sp-match-3d{padding:14px;border-radius:16px;background:linear-gradient(145deg,rgba(30,41,59,.88),rgba(15,23,42,.8));border:1px solid rgba(96,165,250,.15);box-shadow:0 12px 25px rgba(0,0,0,.2);transform:perspective(800px) rotateX(1deg)}
.sp-player-row{display:flex;justify-content:space-between;align-items:center;padding:10px 11px;border-radius:10px;margin:4px 0;background:rgba(2,6,23,.42)}
.sp-player-row.win{background:linear-gradient(90deg,rgba(0,194,168,.18),rgba(0,194,168,.04));border:1px solid rgba(0,194,168,.18)}
.sp-status-live{color:#5eead4;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900}
.sp-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e;animation:spPulse 1.5s infinite}
@keyframes spPulse{50%{opacity:.35;transform:scale(.7)}}
.sp-mode-card{padding:18px;border-radius:18px;cursor:pointer;border:1px solid rgba(148,163,184,.13);background:linear-gradient(145deg,rgba(30,41,59,.72),rgba(15,23,42,.6));transition:.25s}
.sp-mode-card:hover,.sp-mode-card.selected{border-color:rgba(96,165,250,.55);transform:translateY(-4px);box-shadow:0 16px 35px rgba(37,99,235,.14)}
@media(max-width:900px){.sp-3d-grid{grid-template-columns:repeat(2,1fr)}.sp-bracket-3d{grid-template-columns:1fr}.sp-orbit-card{position:relative;right:auto;bottom:auto;margin:0 24px 22px;width:auto}.sp-3d-ui{padding:22px;display:block}}
@media(max-width:600px){.sp-3d-grid{grid-template-columns:1fr}.sp-hero-title{font-size:32px}}

function initOnlinePlayers() {
    const createBtn = document.getElementById('online-create-match');
    const joinBtn = document.getElementById('online-join-match');
    const roomInput = document.getElementById('online-room-code');
    const errorEl = document.getElementById('online-room-error');
    if (!createBtn || !joinBtn || !roomInput) return;

    const openRoom = (roomId) => {
        const clean = String(roomId || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 30).toUpperCase();
        if (!clean) return false;
        const params = new URLSearchParams(location.search);
        params.set('snakeRoom', clean);
        history.replaceState(null, '', location.pathname + '?' + params.toString() + '#snake');
        app.route();
        return true;
    };

    createBtn.onclick = () => {
        const roomId = Math.random().toString(36).slice(2, 8).toUpperCase();
        openRoom(roomId);
    };

    const join = () => {
        const code = roomInput.value.trim();
        if (!code) {
            errorEl.textContent = 'Enter the room code sent by Player 1.';
            errorEl.classList.remove('hidden');
            roomInput.focus();
            return;
        }
        errorEl.classList.add('hidden');
        openRoom(code);
    };

    joinBtn.onclick = join;
    roomInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') join();
    });
    roomInput.addEventListener('input', () => {
        roomInput.value = roomInput.value.replace(/[^a-zA-Z0-9_-]/g, '').toUpperCase();
        errorEl.classList.add('hidden');
    });
}

    function cellCenter(rc){const [r,c]=rc;return{x:O+c*BS+BS/2,y:O+r*BS+BS/2}}
    function pos(pi,ti){
        const t=S.tokens[pi][ti];
        if(t.status==='disabled')return{x:-100,y:-100};
        if(t.status==='base'){
            const [bx,by]=P[pi].home,[dx,dy]=BASE_OFF[ti];
            return{x:O+(bx+dx)*BS,y:O+(by+dy)*BS};
        }
        if(t.status==='home'){
            const c={x:O+7.5*BS,y:O+7.5*BS},ang=[Math.PI, -Math.PI/2, Math.PI/2, 0][pi],spread=(ti-1.5)*17;
            return{x:c.x+Math.cos(ang)*28+Math.cos(ang+Math.PI/2)*spread,y:c.y+Math.sin(ang)*28+Math.sin(ang+Math.PI/2)*spread};
        }
        if(t.steps<=51)return cellCenter(ROUTE[(P[pi].start+t.steps)%52]);
        return cellCenter(HOME_LANES[pi][t.steps-52]);
    }
    function movable(pi,d){
        const c=MODES[mode],a=[];S.tokens[pi].forEach((t,i)=>{
            if(t.status==='disabled'||t.status==='home')return;
            if(t.status==='base'){if(!c.needSix||d===6)a.push(i)}
            else if(t.steps+d+(c.blitz?1:0)<=57)a.push(i);
        });return a;
    }

    function drawCell(r,c,fill='#f8fafc',mark=''){
        const x=O+c*BS,y=O+r*BS;
        const g=ctx.createLinearGradient(x,y,x+BS,y+BS);g.addColorStop(0,'#fff');g.addColorStop(.2,fill);g.addColorStop(1,fill);
        ctx.fillStyle=g;ctx.fillRect(x,y,BS,BS);
        ctx.strokeStyle='#29313d';ctx.lineWidth=2;ctx.strokeRect(x,y,BS,BS);
        ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x+2,y+2,BS-4,5);
        if(mark){ctx.fillStyle='#6b7280';ctx.font='900 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(mark,x+BS/2,y+BS/2);}
    }

    function draw(){
        ctx.clearRect(0,0,900,900);
        const bg=ctx.createRadialGradient(450,400,90,450,450,650);bg.addColorStop(0,'#2f3949');bg.addColorStop(1,'#080e18');ctx.fillStyle=bg;ctx.fillRect(0,0,900,900);

        ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=28;ctx.shadowOffsetY=16;
        const wood=ctx.createLinearGradient(20,20,880,880);wood.addColorStop(0,'#8b5a2b');wood.addColorStop(.2,'#3d2415');wood.addColorStop(.7,'#6b3f1f');wood.addColorStop(1,'#20140c');
        ctx.fillStyle=wood;ctx.beginPath();ctx.roundRect(24,24,852,852,34);ctx.fill();ctx.shadowColor='transparent';

        ctx.fillStyle='#e7e7e7';ctx.fillRect(O,O,15*BS,15*BS);

        // Home quadrants
        const homes=[
          {r:0,c:0,color:P[0].color,dark:P[0].dark},
          {r:0,c:9,color:P[1].color,dark:P[1].dark},
          {r:9,c:0,color:P[2].color,dark:P[2].dark},
          {r:9,c:9,color:P[3].color,dark:P[3].dark}
        ];
        homes.forEach(h=>{
            const x=O+h.c*BS,y=O+h.r*BS,w=6*BS;
            const g=ctx.createLinearGradient(x,y,x+w,y+w);g.addColorStop(0,'#fff');g.addColorStop(.16,h.color);g.addColorStop(1,h.dark);
            ctx.fillStyle=g;ctx.fillRect(x,y,w,w);
            ctx.fillStyle='rgba(20,20,20,.14)';ctx.beginPath();ctx.roundRect(x+35,y+35,w-70,w-70,24);ctx.fill();
        });

        // Main cross route
        ROUTE.forEach((rc,i)=>{
            let fill='#f5f5f5', mark=SAFE.has(i)?'★':'';
            if(i===P[0].start)fill=P[0].color;
            if(i===P[1].start)fill=P[1].color;
            if(i===P[2].start)fill=P[2].color;
            if(i===P[3].start)fill=P[3].color;
            if(MODES[mode].arrows&&ARROWS.has(i))mark='➤';
            drawCell(rc[0],rc[1],fill,mark);
        });

        // Home lanes
        HOME_LANES.forEach((lane,pi)=>lane.forEach(rc=>drawCell(rc[0],rc[1],P[pi].color,'')));

        // Center 4-way home
        const cx=O+7.5*BS,cy=O+7.5*BS;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(O+6*BS, O+6*BS);ctx.lineTo(O+9*BS,O+6*BS);ctx.closePath();ctx.fillStyle=P[1].color;ctx.fill();
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(O+9*BS,O+6*BS);ctx.lineTo(O+9*BS,O+9*BS);ctx.closePath();ctx.fillStyle=P[3].color;ctx.fill();
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(O+9*BS,O+9*BS);ctx.lineTo(O+6*BS,O+9*BS);ctx.closePath();ctx.fillStyle=P[2].color;ctx.fill();
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(O+6*BS,O+9*BS);ctx.lineTo(O+6*BS,O+6*BS);ctx.closePath();ctx.fillStyle=P[0].color;ctx.fill();

        // Pawns
        P.forEach((_,pi)=>S.tokens[pi].forEach((_,ti)=>pawn(pi,ti)));
    }

    function pawn(pi,ti){
        const t=S.tokens[pi][ti];if(t.status==='disabled')return;
        const p=P[pi],q=pos(pi,ti),sel=pi===S.current&&S.selectable.includes(ti);
        ctx.save();ctx.translate(q.x,q.y);
        if(sel){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
        ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;ctx.shadowOffsetY=6;
        const g=ctx.createRadialGradient(-7,-9,2,0,0,24);g.addColorStop(0,'#fff');g.addColorStop(.17,p.color);g.addColorStop(1,p.dark);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-9,11,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.moveTo(-8,1);ctx.quadraticCurveTo(-15,12,-17,17);ctx.quadraticCurveTo(0,24,17,17);ctx.quadraticCurveTo(15,12,8,1);ctx.closePath();ctx.fill();
        ctx.restore();
    }

    function ui(){
        const c=MODES[mode];modeName.textContent=c.name;modeDesc.textContent=c.desc;
        playersEl.innerHTML=P.map((p,i)=>{
            const h=S.tokens[i].filter(t=>t.status==='home').length,total=S.tokens[i].filter(t=>t.status!=='disabled').length,a=i===S.current&&!S.winner;
            return `<div class="rounded-2xl p-3 flex items-center gap-3 ${a?'ring-2 ring-white/20':''}" style="background:rgba(15,23,42,.58)">
                <span class="w-4 h-4 rounded-full" style="background:${p.color};box-shadow:0 0 10px ${p.color}77"></span>
                <div class="flex-1"><p class="text-sm text-white font-black">${p.name}</p><p class="text-[11px] text-gray-500">${h}/${total} Home</p></div>
                ${a?'<span class="text-[10px] text-success font-black">TURN</span>':''}
            </div>`;
        }).join('');
        rollBtn.disabled=busy||S.rolled||!!S.winner||S.current!==0;rollBtn.style.opacity=rollBtn.disabled?'.55':'1';draw();
    }

    function roll(){
        if(busy||S.rolled||S.winner)return;busy=true;let n=0;
        const id=setInterval(()=>{
            const v=1+Math.floor(Math.random()*6);paintDie(v,true);tone(170+v*32,.04,'square',.018);rollLabel.textContent='Rolling...';
            if(++n>=11){clearInterval(id);const d=1+Math.floor(Math.random()*6);paintDie(d,false);S.dice=d;S.rolled=true;S.selectable=movable(S.current,d);busy=false;rollLabel.textContent=P[S.current].name+' rolled '+d;
                if(!S.selectable.length){msg.textContent='No valid move.';ui();setTimeout(()=>next(false),500)}
                else{msg.textContent=P[S.current].name+': select a glowing token.';ui();}
            }
        },58);
    }

    function capture(pi,ti){
        const t=S.tokens[pi][ti];if(t.status!=='track'||t.steps>51)return false;
        const idx=(P[pi].start+t.steps)%52;if(SAFE.has(idx))return false;let hit=false;
        P.forEach((_,oi)=>{if(oi===pi)return;S.tokens[oi].forEach(o=>{
            if(o.status==='track'&&o.steps<=51&&((P[oi].start+o.steps)%52)===idx){o.status='base';o.steps=-1;hit=true}
        })});
        if(hit)tone(160,.18,'sawtooth',.035,70);return hit;
    }

    function animateMove(pi,ti,steps,done){
        let n=0;const tick=()=>{if(n>=steps){done();return}S.tokens[pi][ti].steps++;tone(320,.035,'triangle',.014,410);n++;ui();setTimeout(tick,MODES[mode].speed)};tick();
    }

    function move(ti){
        if(!S.rolled||!S.selectable.includes(ti)||busy)return;
        busy=true;const pi=S.current,t=S.tokens[pi][ti],c=MODES[mode],d=S.dice,mv=d+(c.blitz?1:0);
        const done=()=>{
            if(t.steps===57){t.status='home';tone(640,.16,'sine',.03,940)}
            let cap=capture(pi,ti);
            if(c.arrows&&t.status==='track'&&t.steps<=51){
                const idx=(P[pi].start+t.steps)%52;if(ARROWS.has(idx)){t.steps=Math.min(57,t.steps+4);msg.textContent='Arrow boost! +4 spaces.';tone(520,.16,'sine',.03,900)}
            }
            const h=S.tokens[pi].filter(x=>x.status==='home').length;
            if(h>=c.finish){S.winner=pi;winTitle.textContent=P[pi].name+' Wins!';winTitle.style.color=P[pi].color;winSub.textContent=c.name+' mode completed.';overlay.classList.remove('hidden');busy=false;ui();return}
            const extra=(c.bonusSix&&d===6)||cap;busy=false;next(extra);
        };
        if(t.status==='base'){t.status='track';t.steps=0;tone(330,.05,'triangle',.018);setTimeout(done,200)}
        else animateMove(pi,ti,mv,done);
    }

    function next(extra){
        S.rolled=false;S.dice=null;S.selectable=[];
        if(!extra)S.current=(S.current+1)%4;ui();
        if(S.current!==0&&!S.winner)setTimeout(cpu,450);
    }

    function cpu(){
        if(S.current===0||S.winner)return;roll();
        const wait=()=>{if(busy){setTimeout(wait,100);return}if(S.selectable.length)setTimeout(()=>move(S.selectable[Math.floor(Math.random()*S.selectable.length)]),300)};wait();
    }

    function click(e){
        if(S.current!==0||!S.rolled)return;
        const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*(900/r.width),y=(e.clientY-r.top)*(900/r.height);
        let best=null,bd=999;S.selectable.forEach(i=>{const q=pos(0,i),d=Math.hypot(x-q.x,y-q.y);if(d<bd){bd=d;best=i}});
        if(best!==null&&bd<42)move(best);
    }

    function setMode(m){
        mode=m;document.querySelectorAll('.ludo3d-mode-btn').forEach(b=>{
            const on=b.dataset.mode===m;b.className='ludo3d-mode-btn px-4 py-2.5 rounded-xl font-black text-sm '+(on?'bg-primary text-white':'glass text-gray-300');
        });reset();
    }
    function reset(){S=fresh();busy=false;overlay.classList.add('hidden');paintDie(5);rollLabel.textContent='Tap Roll Dice';msg.textContent='Blue starts. Roll the dice.';ui()}

    document.querySelectorAll('.ludo3d-mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    rollBtn.onclick=()=>{if(S.current===0)roll()};resetBtn.onclick=reset;again.onclick=reset;
    soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇'};
    canvas.addEventListener('pointerdown',click);
    reset();
}

function initCheckers3D(){
    const canvas=document.getElementById('checkers3d-canvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const turnEl=document.getElementById('chk-turn'),scoreEl=document.getElementById('chk-score'),msg=document.getElementById('chk-message');
    const resetBtn=document.getElementById('chk-reset'),soundBtn=document.getElementById('chk-sound');
    const overlay=document.getElementById('chk-overlay'),winTitle=document.getElementById('chk-win-title'),winSub=document.getElementById('chk-win-sub'),again=document.getElementById('chk-again');
    const N=8,PAD=70,SQ=(800-PAD*2)/8;
    let board,turn='r',selected=null,moves=[],soundOn=true,audioCtx=null,captured={r:0,b:0},over=false;

    function tone(f=440,d=.06,type='sine',v=.025,end=null){
        if(!soundOn)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
        const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
        if(end)o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+d);
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
        o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d+.02);
    }

    function freshBoard(){
        const b=Array.from({length:8},()=>Array(8).fill(null));
        for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r][c]={color:'b',king:false};
        for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)b[r][c]={color:'r',king:false};
        return b;
    }

    function drawBoard(){
        ctx.clearRect(0,0,800,800);
        const bg=ctx.createRadialGradient(400,350,80,400,400,600);bg.addColorStop(0,'#8a5a2b');bg.addColorStop(1,'#2b190f');ctx.fillStyle=bg;ctx.fillRect(0,0,800,800);

        ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=28;ctx.shadowOffsetY=18;
        const frame=ctx.createLinearGradient(35,35,765,765);frame.addColorStop(0,'#e0a45c');frame.addColorStop(.25,'#8b5428');frame.addColorStop(.7,'#c9853d');frame.addColorStop(1,'#5c341b');
        ctx.fillStyle=frame;ctx.beginPath();ctx.roundRect(34,34,732,732,34);ctx.fill();ctx.shadowColor='transparent';

        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
            const x=PAD+c*SQ,y=PAD+r*SQ,dark=(r+c)%2===1;
            const g=ctx.createLinearGradient(x,y,x+SQ,y+SQ);
            if(dark){g.addColorStop(0,'#48515b');g.addColorStop(1,'#252c33')}
            else{g.addColorStop(0,'#efb464');g.addColorStop(1,'#c97a32')}
            ctx.fillStyle=g;ctx.fillRect(x,y,SQ,SQ);
            ctx.fillStyle='rgba(255,255,255,.11)';ctx.fillRect(x+2,y+2,SQ-4,5);

            if(selected&&selected.r===r&&selected.c===c){ctx.strokeStyle='#fde047';ctx.lineWidth=6;ctx.strokeRect(x+4,y+4,SQ-8,SQ-8)}
        }

        moves.forEach(m=>{
            const x=PAD+m.c*SQ+SQ/2,y=PAD+m.r*SQ+SQ/2;
            ctx.fillStyle='rgba(34,197,94,.55)';ctx.shadowColor='#22c55e';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
        });

        for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c])drawPiece(r,c,board[r][c]);
    }

    function drawPiece(r,c,p){
        const x=PAD+c*SQ+SQ/2,y=PAD+r*SQ+SQ/2,rad=SQ*.34;
        ctx.save();ctx.translate(x,y);
        ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=10;ctx.shadowOffsetY=7;
        const base=p.color==='r'?['#ff6b67','#c61b19','#6b0b0b']:['#6f7780','#1f252a','#050607'];
        const g=ctx.createRadialGradient(-rad*.35,-rad*.4,3,0,0,rad);
        g.addColorStop(0,base[0]);g.addColorStop(.35,base[1]);g.addColorStop(1,base[2]);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,5,rad,0,Math.PI*2);ctx.fill();
        ctx.shadowColor='transparent';
        ctx.strokeStyle=p.color==='r'?'#ff8f8b':'#8f969e';ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(0,0,rad*.72,0,Math.PI*2);ctx.stroke();
        ctx.lineWidth=2.5;
        for(let rr=rad*.5;rr>8;rr-=7){ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.stroke();}
        if(p.king){ctx.fillStyle='#facc15';ctx.font='900 28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1)}
        ctx.restore();
    }

    function legalMoves(r,c,onlyCaptures=false){
        const p=board[r][c];if(!p)return[];
        const dirs=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:(p.color==='r'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]]);
        const out=[];
        for(const [dr,dc] of dirs){
            const r1=r+dr,c1=c+dc,r2=r+dr*2,c2=c+dc*2;
            if(r1>=0&&r1<8&&c1>=0&&c1<8){
                if(!board[r1][c1]&&!onlyCaptures)out.push({r:r1,c:c1,capture:null});
                else if(board[r1][c1]&&board[r1][c1].color!==p.color&&r2>=0&&r2<8&&c2>=0&&c2<8&&!board[r2][c2]){
                    out.push({r:r2,c:c2,capture:{r:r1,c:c1}});
                }
            }
        }
        return onlyCaptures?out.filter(x=>x.capture):out;
    }

    function allCaptures(color){
        const all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.color===color){const ms=legalMoves(r,c,true);if(ms.length)all.push({r,c,moves:ms})}
        return all;
    }

    function countPieces(color){let n=0;for(const row of board)for(const p of row)if(p?.color===color)n++;return n}

    function ui(){
        turnEl.textContent=turn==='r'?'Red':'Black';turnEl.className='text-xl font-black '+(turn==='r'?'text-red-400':'text-gray-300');
        scoreEl.textContent=captured.r+' - '+captured.b;
        drawBoard();
    }

    function finishIfNeeded(){
        const red=countPieces('r'),black=countPieces('b');
        let winner=null;
        if(red===0)winner='Black';
        if(black===0)winner='Red';
        if(!winner){
            let any=false;
            for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.color===turn&&legalMoves(r,c).length){any=true;break}
            if(!any)winner=turn==='r'?'Black':'Red';
        }
        if(winner){
            over=true;winTitle.textContent=winner+' Wins!';winTitle.style.color=winner==='Red'?'#ef4444':'#e5e7eb';
            winSub.textContent='Opponent has no remaining legal moves.';overlay.classList.remove('hidden');tone(720,.45,'sine',.035,1050);return true;
        }
        return false;
    }

    function click(e){
        if(over)return;
        const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*(800/rect.width),y=(e.clientY-rect.top)*(800/rect.height);
        const c=Math.floor((x-PAD)/SQ),r=Math.floor((y-PAD)/SQ);
        if(r<0||r>=8||c<0||c>=8)return;

        const chosen=moves.find(m=>m.r===r&&m.c===c);
        if(selected&&chosen){
            const p=board[selected.r][selected.c];board[selected.r][selected.c]=null;board[r][c]=p;
            if(chosen.capture){board[chosen.capture.r][chosen.capture.c]=null;captured[turn]++;tone(170,.14,'sawtooth',.03,80)}
            else tone(330,.05,'triangle',.018,420);

            if(p.color==='r'&&r===0)p.king=true;
            if(p.color==='b'&&r===7)p.king=true;

            if(chosen.capture){
                const more=legalMoves(r,c,true);
                if(more.length){selected={r,c};moves=more;msg.textContent='Capture again with the same piece.';ui();return}
            }

            selected=null;moves=[];turn=turn==='r'?'b':'r';
            msg.textContent=(turn==='r'?'Red':'Black')+' turn. Select a piece.';
            ui();finishIfNeeded();return;
        }

        if(board[r][c]?.color===turn){
            const forced=allCaptures(turn),forceMap=forced.find(x=>x.r===r&&x.c===c);
            if(forced.length&&!forceMap){msg.textContent='A capture is available. You must jump.';selected=null;moves=[];ui();return}
            selected={r,c};moves=forceMap?forceMap.moves:legalMoves(r,c);
            if(!moves.length){selected=null;msg.textContent='That piece has no legal move.'}
            else msg.textContent='Tap a highlighted square.';
            ui();
        }
    }

    function reset(){
        board=freshBoard();turn='r';selected=null;moves=[];captured={r:0,b:0};over=false;overlay.classList.add('hidden');msg.textContent='Red starts. Select a piece.';ui();
    }

    canvas.addEventListener('pointerdown',click);
    resetBtn.onclick=reset;again.onclick=reset;
    soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇'};
    reset();
}

function initTrexGame() {
    const canvas = document.getElementById('trex-canvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('trex-score');
    const bestEl = document.getElementById('trex-best');
    const distanceEl = document.getElementById('trex-distance');
    const speedTextEl = document.getElementById('trex-speed-text');
    const speedBarsEl = document.getElementById('trex-speed-bars');
    const heartsEl = document.getElementById('trex-hearts');
    const coinsEl = document.getElementById('trex-coins');
    const overlay = document.getElementById('trex-overlay');
    const titleEl = document.getElementById('trex-title');
    const subtitleEl = document.getElementById('trex-subtitle');
    const startBtn = document.getElementById('trex-start');
    const jumpBtn = document.getElementById('trex-jump-btn');
    const duckBtn = document.getElementById('trex-duck-btn');
    const fireBtn = document.getElementById('trex-fire-btn');
    const soundBtn = document.getElementById('trex-sound');
    const pauseBtn = document.getElementById('trex-pause');

    const W=canvas.width,H=canvas.height,groundY=535;
    let running=false,paused=false,raf=0,last=0,spawnTimer=.8,score=0,distance=0,speed=410,coins=0,lives=3,runClock=0,soundOn=true;
    let best=Number(localStorage.getItem('boyRunnerBest')||0);
    let obstacles=[],coinItems=[],dust=[],stars=[],bullets=[],blasts=[];
    bestEl.textContent=best;

    for(let i=0;i<95;i++) stars.push({x:Math.random()*W,y:Math.random()*320,r:Math.random()*1.6+.3,a:Math.random()*.75+.2});

    const boy={x:210,y:groundY-96,w:62,h:96,normalH:96,duckH:52,vy:0,onGround:true,ducking:false};

    const audio = {
        ctx:null,
        ensure(){
            if(!soundOn)return null;
            const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
            if(!this.ctx)this.ctx=new AC();
            if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
            return this.ctx;
        },
        tone(f=440,d=.07,type='sine',v=.025,end=null){
            const c=this.ensure();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
            o.type=type;o.frequency.setValueAtTime(f,t);if(end)o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+d);
            g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
            o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);
        },
        jump(){this.tone(260,.12,'square',.035,620)},
        coin(){this.tone(650,.08,'sine',.03,940)},
        hit(){this.tone(180,.18,'sawtooth',.04,80)},
        fire(){this.tone(120,.12,'sawtooth',.025,65)}
    };

    function reset(){
        score=0;distance=0;speed=410;coins=0;lives=3;spawnTimer=.8;runClock=0;obstacles=[];coinItems=[];dust=[];bullets=[];blasts=[];
        boy.h=boy.normalH;boy.ducking=false;boy.y=groundY-boy.h;boy.vy=0;boy.onGround=true;
        overlay.classList.remove('hidden');
        titleEl.textContent='Ready to Run?';subtitleEl.textContent='Press ↑ to jump, ↓ / S to sit, and SPACE to fire and destroy hurdles.';startBtn.textContent='Start Game';
        updateHUD();draw();
    }

    function updateHUD(){
        scoreEl.textContent=Math.floor(score);
        distanceEl.textContent=Math.floor(distance)+' m';
        speedTextEl.textContent=(speed/410).toFixed(1)+'x';
        coinsEl.textContent=coins;
        heartsEl.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
        const bars=Math.min(10,Math.max(1,Math.floor((speed-360)/65)));
        speedBarsEl.innerHTML=Array.from({length:10},(_,i)=>{
            const bg=i<bars?(i<4?'#22c55e':i<7?'#eab308':i<9?'#f59e0b':'#ef4444'):'#1e293b';
            return `<span style="display:block;width:18px;height:10px;border-radius:3px;transform:skew(-14deg);background:${bg}"></span>`;
        }).join('');
    }

    function jump(){
        if(!running||paused)return;
        if(boy.onGround&&!boy.ducking){boy.vy=-930;boy.onGround=false;audio.jump();}
    }

    function shoot(){
        if(!running||paused)return;
        const now=performance.now();
        if(shoot.last && now-shoot.last<180)return;
        shoot.last=now;
        bullets.push({x:boy.x+boy.w-2,y:boy.y+boy.h*.48,w:30,h:8,v:1050});
        audio.fire();
    }

    function setDuck(active){
        if(!running||paused)return;
        if(active&&boy.onGround&&!boy.ducking){boy.ducking=true;boy.h=boy.duckH;boy.y=groundY-boy.h;}
        else if(!active&&boy.ducking){boy.ducking=false;boy.h=boy.normalH;boy.y=groundY-boy.h;}
    }

    function start(){
        reset();running=true;paused=false;overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
    }

    function togglePause(){
        if(!running)return;
        paused=!paused;
        if(paused){cancelAnimationFrame(raf);titleEl.textContent='Paused';subtitleEl.textContent='Press pause again to continue.';startBtn.textContent='Resume';overlay.classList.remove('hidden');}
        else{overlay.classList.add('hidden');last=performance.now();raf=requestAnimationFrame(loop);}
    }

    function gameOver(){
        running=false;cancelAnimationFrame(raf);audio.hit();
        const fs=Math.floor(score);if(fs>best){best=fs;localStorage.setItem('boyRunnerBest',String(best));bestEl.textContent=best}
        titleEl.textContent='Game Over';subtitleEl.textContent=`Score ${fs} · Distance ${Math.floor(distance)} m · Coins ${coins}`;startBtn.textContent='Play Again';overlay.classList.remove('hidden');
    }

    function spawnObstacle(){
        const roll=Math.random();

        if(roll < .25){
            const w=95+Math.random()*35,h=32+Math.random()*8;
            obstacles.push({x:W+50,y:groundY-102-Math.random()*15,w,h,type:'air',phase:Math.random()*6});
        }else if(roll < .48){
            const w=62+Math.random()*40,h=44+Math.random()*14;
            obstacles.push({x:W+50,y:groundY-h,w,h,type:'fire',phase:Math.random()*6});
        }else if(roll < .72){
            const w=72+Math.random()*28,h=58+Math.random()*22;
            obstacles.push({x:W+50,y:groundY-h,w,h,type:'hurdle',phase:0});
        }else{
            const tall=Math.random()>.5,w=34+Math.random()*18,h=tall?88+Math.random()*34:56+Math.random()*24;
            obstacles.push({x:W+50,y:groundY-h,w,h,type:'ground',phase:0});
        }

        if(Math.random()<.7){
            const baseX=W+130+Math.random()*100;
            const count=1+Math.floor(Math.random()*3);
            for(let i=0;i<count;i++) coinItems.push({x:baseX+i*45,y:groundY-145-Math.random()*60,r:14,t:Math.random()*6});
        }
    }

    function hitBox(a,b){
        const px=10,py=7;
        return a.x+px<b.x+b.w && a.x+a.w-px>b.x && a.y+py<b.y+b.h && a.y+a.h-py>b.y;
    }

    function update(dt){
        score+=dt*22;distance+=dt*(speed/58);speed=Math.min(920,410+score*.55);runClock+=dt*(speed/48);
        updateHUD();

        if(!boy.ducking){boy.vy+=2450*dt;boy.y+=boy.vy*dt;}
        if(boy.y>=groundY-boy.h){boy.y=groundY-boy.h;boy.vy=0;boy.onGround=true}else boy.onGround=false;

        spawnTimer-=dt;
        if(spawnTimer<=0){spawnObstacle();spawnTimer=Math.max(.72,1.55-speed/1300)+Math.random()*.7}

        obstacles.forEach(o=>{o.x-=speed*dt;o.phase=(o.phase||0)+dt*9;});
        bullets.forEach(b=>b.x+=b.v*dt);
        blasts.forEach(b=>{b.t-=dt;b.r+=dt*80});
        coinItems.forEach(c=>{c.x-=speed*dt;c.t+=dt*5});
        // Bullets destroy physical hurdles/cacti and flying hurdles on contact. Fire pits remain indestructible.
        for(const b of bullets){
            for(const o of obstacles){
                if(o.destroyed || o.type==='fire') continue;
                if(hitBox(b,o)){o.destroyed=true;b.dead=true;score+=35;blasts.push({x:o.x+o.w/2,y:o.y+o.h/2,r:8,t:.28});audio.hit();break;}
            }
        }
        obstacles=obstacles.filter(o=>!o.destroyed&&o.x+o.w>-60);
        bullets=bullets.filter(b=>!b.dead&&b.x<W+80);
        blasts=blasts.filter(b=>b.t>0);
        coinItems=coinItems.filter(c=>c.x+c.r>-40&&!c.collected);

        for(const c of coinItems){
            const b={x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2};
            if(hitBox(boy,b)){c.collected=true;coins++;score+=20;audio.coin();}
        }

        for(const o of obstacles){
            if(hitBox(boy,o)){
                o.x=-999;lives--;
                if(o.type==='fire') audio.fire();
                audio.hit();
                updateHUD();
                if(lives<=0)return gameOver();
            }
        }

        if(boy.onGround&&!boy.ducking&&Math.random()<.24)dust.push({x:boy.x+15,y:groundY-5,r:3+Math.random()*5,a:.45});
        dust.forEach(d=>{d.x-=speed*dt*.18;d.y-=dt*8;d.a-=dt*.7;d.r+=dt*2});
        dust=dust.filter(d=>d.a>0);
    }

    function drawBackground(){
        // Realistic runner scene: use the repository's existing Boy Runner artwork.
        if(!window.realRunnerScene){
            window.realRunnerScene=new Image();
            window.realRunnerScene.src='boy_runner_3d.jpg';
        }
        if(window.realRunnerScene.complete && window.realRunnerScene.naturalWidth){
            const iw=window.realRunnerScene.naturalWidth, ih=window.realRunnerScene.naturalHeight;
            const scale=Math.max(W/iw,H/ih);
            const dw=iw*scale, dh=ih*scale;
            ctx.drawImage(window.realRunnerScene,(W-dw)*.5,(H-dh)*.5,dw,dh);
            const shade=ctx.createLinearGradient(0,0,0,H);
            shade.addColorStop(0,'rgba(2,8,23,.04)');
            shade.addColorStop(.6,'rgba(2,8,23,.03)');
            shade.addColorStop(1,'rgba(2,8,23,.28)');
            ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
            ctx.globalAlpha=.14;ctx.strokeStyle='#fff';ctx.lineWidth=3;
            const phase=(distance*7)%130;
            for(let i=-1;i<18;i++){
                const x=i*100-phase,y=groundY+38+(i%4)*18;
                ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+55,y);ctx.stroke();
            }
            ctx.globalAlpha=1;
            return;
        }
        const sky=ctx.createLinearGradient(0,0,0,H);
        sky.addColorStop(0,'#020617');sky.addColorStop(.5,'#0b2740');sky.addColorStop(1,'#111827');
        ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#202b36';ctx.fillRect(0,groundY,W,H-groundY);
    }

    function drawBoy(){
        const x=boy.x,y=boy.y,t=runClock;
        ctx.save();ctx.lineCap='round';ctx.lineJoin='round';

        // Ground shadow
        ctx.globalAlpha=.32;ctx.fillStyle='#000';ctx.beginPath();
        ctx.ellipse(x+35,groundY+5,36,9,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

        const bob=boy.onGround&&!boy.ducking?Math.sin(t*2)*1.5:0;
        const swing=Math.sin(t)*18;
        const yy=y+bob;

        // Human runner — proportional head, neck, torso, arms and legs.
        if(boy.ducking){
            ctx.fillStyle='#111827';ctx.beginPath();ctx.roundRect(x+22,yy+32,54,18,8);ctx.fill();
            ctx.fillStyle='#2563eb';ctx.beginPath();ctx.roundRect(x+21,yy+15,43,32,11);ctx.fill();
            ctx.fillStyle='#d9a27f';ctx.beginPath();ctx.ellipse(x+14,yy+15,14,16,-.12,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#171717';ctx.beginPath();ctx.arc(x+13,yy+9,15,Math.PI,Math.PI*2);ctx.fill();
            ctx.strokeStyle='#d49a76';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+53,yy+24);ctx.lineTo(x+76,yy+34);ctx.stroke();
            ctx.strokeStyle='#111827';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x+36,yy+44);ctx.lineTo(x+74,yy+48);ctx.stroke();
            ctx.strokeStyle='#f8fafc';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x+68,yy+48);ctx.lineTo(x+84,yy+48);ctx.stroke();
            ctx.restore();return;
        }

        const hipX=x+34,hipY=yy+67;

        // Shoes + legs
        ctx.strokeStyle='#111827';ctx.lineWidth=14;
        ctx.beginPath();ctx.moveTo(hipX,hipY);ctx.lineTo(x+27-swing*.55,yy+81);ctx.lineTo(x+18-swing,yy+95);ctx.stroke();
        ctx.strokeStyle='#f8fafc';ctx.lineWidth=8;
        ctx.beginPath();ctx.moveTo(x+15-swing,yy+96);ctx.lineTo(x+31-swing,yy+96);ctx.stroke();

        ctx.strokeStyle='#0f172a';ctx.lineWidth=14;
        ctx.beginPath();ctx.moveTo(hipX+5,hipY);ctx.lineTo(x+43+swing*.55,yy+80);ctx.lineTo(x+51+swing,yy+92);ctx.stroke();
        ctx.strokeStyle='#60a5fa';ctx.lineWidth=8;
        ctx.beginPath();ctx.moveTo(x+47+swing,yy+93);ctx.lineTo(x+64+swing,yy+93);ctx.stroke();

        // Shorts and athletic shirt
        ctx.fillStyle='#111827';ctx.beginPath();ctx.roundRect(x+19,yy+57,31,20,7);ctx.fill();
        const shirt=ctx.createLinearGradient(x+16,yy+30,x+53,yy+70);
        shirt.addColorStop(0,'#60a5fa');shirt.addColorStop(.45,'#2563eb');shirt.addColorStop(1,'#0f3b82');
        ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(x+16,yy+31,38,40,12);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x+21,yy+36,4,29);

        // Natural arm swing
        ctx.strokeStyle='#d39a76';ctx.lineWidth=9;
        ctx.beginPath();ctx.moveTo(x+19,yy+40);ctx.lineTo(x+8-swing*.45,yy+54);ctx.lineTo(x+4-swing*.65,yy+67);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+49,yy+40);ctx.lineTo(x+61+swing*.4,yy+53);ctx.lineTo(x+67+swing*.65,yy+61);ctx.stroke();
        ctx.fillStyle='#d9a27f';
        ctx.beginPath();ctx.arc(x+4-swing*.65,yy+67,4.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(x+67+swing*.65,yy+61,4.5,0,Math.PI*2);ctx.fill();

        // Neck
        const neck=ctx.createLinearGradient(x+27,yy+25,x+38,yy+36);
        neck.addColorStop(0,'#f0bd98');neck.addColorStop(1,'#b97859');
        ctx.fillStyle=neck;ctx.fillRect(x+27,yy+25,10,11);

        // More realistic head / skin shading
        const skin=ctx.createRadialGradient(x+36,yy+12,2,x+30,yy+20,21);
        skin.addColorStop(0,'#f6cfad');skin.addColorStop(.55,'#dba27d');skin.addColorStop(1,'#9b5f48');
        ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(x+31,yy+18,15.5,18.5,-.08,0,Math.PI*2);ctx.fill();

        // Ear
        ctx.fillStyle='#d79a74';ctx.beginPath();ctx.arc(x+17,yy+20,4.7,0,Math.PI*2);ctx.fill();

        // Hair with individual strands
        const hair=ctx.createLinearGradient(x+15,yy,x+49,yy+15);
        hair.addColorStop(0,'#090b10');hair.addColorStop(.55,'#24272b');hair.addColorStop(1,'#050609');
        ctx.fillStyle=hair;ctx.beginPath();
        ctx.moveTo(x+15,yy+14);ctx.quadraticCurveTo(x+14,yy-7,x+30,yy+1);
        ctx.quadraticCurveTo(x+45,yy-5,x+50,yy+10);ctx.quadraticCurveTo(x+42,yy+6,x+37,yy+11);
        ctx.quadraticCurveTo(x+29,yy+5,x+22,yy+12);ctx.closePath();ctx.fill();

        ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1.3;
        for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+20+i*5,yy+6);ctx.lineTo(x+24+i*4,yy+1+(i%2)*2);ctx.stroke();}

        // Eyes, brows, nose and mouth
        ctx.strokeStyle='#4b3024';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(x+32,yy+13);ctx.lineTo(x+39,yy+12);ctx.stroke();
        ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+38,yy+18,1.8,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#9b6248';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x+42,yy+19);ctx.lineTo(x+43,yy+24);ctx.stroke();
        ctx.strokeStyle='#7f4634';ctx.beginPath();ctx.moveTo(x+37,yy+28);ctx.quadraticCurveTo(x+41,yy+30,x+45,yy+27);ctx.stroke();

        // Shirt branding
        ctx.fillStyle='#fff';ctx.font='900 8px Arial';ctx.textAlign='center';ctx.fillText('SP',x+35,yy+55);

        ctx.restore();
    }

    function drawCactus(o){
        ctx.save();ctx.fillStyle='#3f7d20';ctx.strokeStyle='#275d15';ctx.lineWidth=4;
        ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeRect(o.x,o.y,o.w,o.h);
        ctx.fillRect(o.x-14,o.y+o.h*.35,14,10);ctx.fillRect(o.x-14,o.y+o.h*.2,10,o.h*.25);
        ctx.fillRect(o.x+o.w,o.y+o.h*.5,14,10);ctx.fillRect(o.x+o.w+6,o.y+o.h*.36,10,o.h*.25);
        ctx.restore();
    }


    function drawHurdle(o){
        ctx.save();
        ctx.translate(o.x,o.y);
        ctx.fillStyle='#334155';
        ctx.fillRect(4,o.h-10,18,10);
        ctx.fillRect(o.w-22,o.h-10,18,10);
        ctx.fillStyle='#64748b';
        ctx.fillRect(10,6,10,o.h-8);
        ctx.fillRect(o.w-20,6,10,o.h-8);
        const barY=12;
        ctx.fillStyle='#f8fafc';
        ctx.fillRect(5,barY,o.w-10,18);
        const stripeW=14;
        for(let x=5;x<o.w-5;x+=stripeW*2){
            ctx.fillStyle='#ef4444';
            ctx.beginPath();
            ctx.moveTo(x,barY);
            ctx.lineTo(Math.min(x+stripeW,o.w-5),barY);
            ctx.lineTo(Math.min(x+stripeW-7,o.w-5),barY+18);
            ctx.lineTo(Math.max(x-7,5),barY+18);
            ctx.closePath();
            ctx.fill();
        }
        ctx.strokeStyle='#0f172a';
        ctx.lineWidth=3;
        ctx.strokeRect(5,barY,o.w-10,18);
        ctx.restore();
    }

    function drawFire(o){
        ctx.save();
        ctx.translate(o.x,o.y);
        ctx.shadowBlur=22;
        ctx.shadowColor='#f97316';
        const flameCount=Math.max(3,Math.floor(o.w/18));
        for(let i=0;i<flameCount;i++){
            const fx=(i+.5)*(o.w/flameCount);
            const flicker=Math.sin((o.phase||0)+i*1.7)*6;
            const fh=o.h*(.68+.2*Math.sin((o.phase||0)*1.4+i));
            ctx.fillStyle='#ef4444';
            ctx.beginPath();
            ctx.moveTo(fx-10,o.h);
            ctx.quadraticCurveTo(fx-14,o.h-fh*.45,fx-2,o.h-fh*.7);
            ctx.quadraticCurveTo(fx+flicker,o.h-fh,fx+9,o.h-fh*.48);
            ctx.quadraticCurveTo(fx+15,o.h-fh*.2,fx+10,o.h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle='#fbbf24';
            ctx.beginPath();
            ctx.moveTo(fx-5,o.h);
            ctx.quadraticCurveTo(fx-7,o.h-fh*.3,fx,o.h-fh*.55);
            ctx.quadraticCurveTo(fx+7,o.h-fh*.28,fx+6,o.h);
            ctx.closePath();
            ctx.fill();
        }
        ctx.shadowBlur=0;
        ctx.fillStyle='#3f1d12';
        ctx.fillRect(0,o.h-8,o.w,8);
        for(let i=0;i<Math.ceil(o.w/18);i++){
            ctx.fillStyle=i%2?'#7c2d12':'#991b1b';
            ctx.beginPath();
            ctx.arc(8+i*18,o.h-7,7,0,Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawFlying(o){
        ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle='#273244';ctx.strokeStyle='#111827';ctx.lineWidth=3;
        ctx.beginPath();ctx.ellipse(o.w*.48,o.h*.56,o.w*.26,o.h*.28,0,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.moveTo(o.w*.42,o.h*.45);ctx.lineTo(o.w*.05,0);ctx.lineTo(o.w*.36,o.h*.62);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.moveTo(o.w*.55,o.h*.42);ctx.lineTo(o.w*.95,2);ctx.lineTo(o.w*.63,o.h*.62);ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.moveTo(o.w*.72,o.h*.5);ctx.lineTo(o.w,o.h*.62);ctx.lineTo(o.w*.74,o.h*.68);ctx.fill();ctx.stroke();
        ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(o.w*.16,o.h*.55);ctx.lineTo(0,o.h*.62);ctx.lineTo(o.w*.18,o.h*.67);ctx.fill();
        ctx.restore();
    }

    function drawCoin(c){
        ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(c.t)*.25);ctx.shadowBlur=14;ctx.shadowColor='#f59e0b';ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fde68a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff7cc';ctx.font='900 16px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);ctx.restore();
    }

    function draw(){
        drawBackground();
        dust.forEach(d=>{ctx.globalAlpha=d.a;ctx.fillStyle='#d6b08b';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
        coinItems.forEach(drawCoin);
        obstacles.forEach(o=>{
            if(o.type==='air') drawFlying(o);
            else if(o.type==='fire') drawFire(o);
            else if(o.type==='hurdle') drawHurdle(o);
            else drawCactus(o);
        });
        bullets.forEach(b=>{ctx.save();ctx.shadowBlur=20;ctx.shadowColor='#fb923c';ctx.fillStyle='#fde047';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#f97316';ctx.fillRect(b.x-10,b.y+1,14,b.h-2);ctx.restore();});
        blasts.forEach(b=>{ctx.save();ctx.globalAlpha=Math.max(0,b.t/.28);ctx.strokeStyle='#fb923c';ctx.lineWidth=8;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();ctx.restore();});
        // Human runner is rendered by the realistic repository artwork; no cartoon/procedural boy.
    }

    function loop(now){
        if(!running||paused)return;
        const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();if(running&&!paused)raf=requestAnimationFrame(loop);
    }

    const kd=e=>{
        if(!document.getElementById('trex-canvas'))return;
        if(e.code==='ArrowUp'){e.preventDefault();if(running)jump();else start()}
        if(e.code==='Space'){e.preventDefault();if(running)shoot();else start()}
        if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();setDuck(true)}
    };

    document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);

    startBtn.onclick=()=>paused?togglePause():start();
    jumpBtn.onclick=()=>running?jump():start();
    if(duckBtn){duckBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(!running)start();else setDuck(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>duckBtn.addEventListener(ev,()=>setDuck(false)));}
    if(fireBtn) fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(!running)start();else shoot();});
    pauseBtn.onclick=togglePause;

    reset();
}

        if(a.alive&&!b.alive)winner=0; else if(b.alive&&!a.alive)winner=1; else if(a.score>b.score)winner=0; else if(b.score>a.score)winner=1;

        else{state.round++;showOverlay(winner<0?'Round Draw':state.players[winner].name+' wins Round '+(state.round-1),'Score '+Math.floor(a.score)+' vs '+Math.floor(b.score));broadcast();roundTimer=setTimeout(beginRound,2200);}

    function update(dt){

        state.players.forEach(p=>{if(!p.alive)return;p.score=state.score;p.vy+=2050*dt;p.y+=p.vy*dt;if(p.y>=groundY-62){p.y=groundY-62;p.vy=0;p.onGround=true;}if(state.obstacles.some(o=>hit(p,o)))p.alive=false;});
        if(!state.players[0].alive||!state.players[1].alive)finishRound();
    }
    function drawDino(p,color,x=105){ctx.save();ctx.globalAlpha=p.alive?1:.28;ctx.fillStyle=color;ctx.fillRect(x+8,p.y+18,34,34);ctx.fillRect(x+29,p.y+4,27,27);ctx.fillRect(x+48,p.y+11,13,7);ctx.fillRect(x,p.y+28,18,10);ctx.fillRect(x+15,p.y+47,9,15);ctx.fillRect(x+34,p.y+47,9,15);ctx.fillStyle='#fff';ctx.fillRect(x+46,p.y+10,4,4);ctx.restore();}
    function draw(){
        ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f8fafc');g.addColorStop(1,'#e2e8f0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(W,groundY);ctx.stroke();
        state?.obstacles?.forEach(o=>{ctx.fillStyle='#334155';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillRect(o.x-7,o.y+16,8,9);ctx.fillRect(o.x+o.w-1,o.y+24,8,9);});
        if(state){drawDino(state.players[0],'#2563EB',105);drawDino(state.players[1],'#00C2A8',105);ctx.fillStyle='#475569';ctx.font='700 16px Inter,sans-serif';ctx.textAlign='right';ctx.fillText('ROUND '+state.round+' · '+Math.floor(state.score).toString().padStart(5,'0'),W-25,32);}
    }
    function loop(now){if(destroyed||!isHost||!state?.running)return;const dt=Math.min(.032,(now-last)/1000||.016);last=now;update(dt);draw();sendClock+=dt;if(sendClock>.045){sendClock=0;broadcast();}if(state.running)raf=requestAnimationFrame(loop);}
    function handleData(d){if(!d)return;if(isHost&&d.type==='jump'){jumpPlayer(1);return;}if(!isHost&&d.type==='state'){state=d;syncUI();draw();if(state.running)hideOverlay();else if(state.wins[0]>=2||state.wins[1]>=2){const c=state.wins[0]>=2?0:1;showOverlay(state.players[c].name+' Wins!','Tournament champion · '+state.wins[0]+'–'+state.wins[1]);}}}
    function attach(c){conn=c;c.on('open',()=>{connected=true;if(isHost){state.players[1].name=c.metadata?.name||'Player 2';setStatus('2 players connected · LIVE','#22C55E');syncUI();broadcast();beginRound();}else{setStatus('Connected · LIVE','#22C55E');roleEl.textContent='Player 2 · Guest';} });c.on('data',handleData);c.on('close',()=>{connected=false;setStatus('Opponent disconnected','#EF4444');showOverlay('Opponent Left','Reopen/share the same room link to reconnect.');if(isHost&&state)state.running=false;});}
    function host(){isHost=true;roleEl.textContent='Player 1 · Host';state=freshState();state.players[0].name=playerName;setStatus('Waiting for Player 2','#F59E0B');showOverlay('Waiting for Player 2','Share the invite link or room code '+roomId+'.');peer.on('connection',c=>{if(conn?.open){c.close();return;}attach(c);});draw();}
    function guest(){isHost=false;roleEl.textContent='Player 2 · Guest';setStatus('Connecting to Player 1...','#F59E0B');attach(peer.connect(hostId,{reliable:true,metadata:{name:playerName}}));}
    peer=new Peer(hostId);let opened=false;peer.on('open',()=>{opened=true;host();});peer.on('error',err=>{if(!opened&&err?.type==='unavailable-id'){try{peer.destroy();}catch(_){}peer=new Peer();peer.on('open',guest);peer.on('error',()=>showOverlay('Connection Failed','Could not connect to this tournament room.'));}else console.warn('T-Rex tournament PeerJS',err);});

    function key(e){if(!document.getElementById('tt-canvas'))return;if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();localJump();}}
    document.addEventListener('keydown',key);jumpBtn.onclick=localJump;canvas.addEventListener('pointerdown',localJump);
    actionBtn.onclick=()=>{if(isHost){state.round=1;state.wins=[0,0];syncUI();beginRound();}};
    const cleanup=()=>{if(location.hash!=='#tournament-trex'){destroyed=true;clearTimeout(roundTimer);cancelAnimationFrame(raf);document.removeEventListener('keydown',key);try{conn?.close();peer?.destroy();}catch(_){}window.removeEventListener('hashchange',cleanup);}};window.addEventListener('hashchange',cleanup);

function initSnakeGame() {
    const canvas = document.getElementById('snake-canvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    const roomEl = document.getElementById('snake-room-code');
    const statusEl = document.getElementById('snake-connection-status');
    const liveDot = document.getElementById('snake-live-dot');
    const roleEl = document.getElementById('snake-my-role');
    const p1NameEl = document.getElementById('snake-player1-name');
    const p2NameEl = document.getElementById('snake-player2-name');
    const p1ScoreEl = document.getElementById('snake-score-p1');
    const p2ScoreEl = document.getElementById('snake-score-p2');
    const overlay = document.getElementById('snake-overlay');
    const titleEl = document.getElementById('snake-title');
    const subtitleEl = document.getElementById('snake-subtitle');
    const actionBtn = document.getElementById('snake-overlay-action');
    const copyBtn = document.getElementById('snake-copy-link');

    if (!window.Peer) {
        titleEl.textContent = 'Live service unavailable';
        subtitleEl.textContent = 'PeerJS could not load. Check your internet connection and reload.';
        statusEl.textContent = 'Offline';
        statusEl.style.color = '#EF4444';
        return;
    }

    const GRID = 20;
    const CELL = canvas.width / GRID;
    const TICK = 125;
    const clientId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
    const playerName = 'Player-' + clientId.slice(0, 4).toUpperCase();
    let role = null;
    let peer = null;
    let conn = null;
    let loop = null;
    let gameState = null;
    let running = false;
    let destroyed = false;
    let guestDirection = {x:-1,y:0};
    let hostDirection = {x:1,y:0};

    const qs = new URLSearchParams(location.search);
    let roomId = (qs.get('snakeRoom') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 30);
    if (!roomId) {
        roomId = Math.random().toString(36).slice(2, 8).toUpperCase();
        qs.set('snakeRoom', roomId);
        history.replaceState(null, '', location.pathname + '?' + qs.toString() + '#snake');
    }
    const hostPeerId = 'sultanpro-snake-' + roomId.toLowerCase();
    roomEl.textContent = roomId;

    const inviteUrl = location.origin === 'null'
        ? location.href
        : location.origin + location.pathname + '?snakeRoom=' + encodeURIComponent(roomId) + '#snake';

    function setStatus(text, color='#F59E0B', dot='#F59E0B') {
        statusEl.textContent = text;
        statusEl.style.color = color;
        liveDot.style.background = dot;
        liveDot.style.boxShadow = `0 0 8px ${dot}`;
    }

    function showOverlay(title, subtitle, buttonText='') {
        overlay.classList.remove('opacity-0','pointer-events-none');
        titleEl.textContent = title;
        subtitleEl.textContent = subtitle;
        if (buttonText) {
            actionBtn.textContent = buttonText;
            actionBtn.classList.remove('hidden');
        } else {
            actionBtn.classList.add('hidden');
        }
    }

    function hideOverlay() {
        overlay.classList.add('opacity-0','pointer-events-none');
        actionBtn.classList.add('hidden');
    }

    async function copyInvite() {
        try {
            await navigator.clipboard.writeText(inviteUrl);
            const old = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Link Copied';
            if (window.lucide) lucide.createIcons();
            setTimeout(() => { if (copyBtn) { copyBtn.innerHTML = old; if(window.lucide) lucide.createIcons(); } }, 1600);
        } catch (_) {
            window.prompt('Copy this invite link:', inviteUrl);
        }
    }
    copyBtn.addEventListener('click', copyInvite);

    function initialState() {
        return {
            type:'state', running:true, winner:null,
            totalDots:50, dotsCaptured:0,
            food:{x:10,y:10},
            p1:{name:playerName, score:0, alive:true, dir:{x:1,y:0}, snake:[{x:4,y:7},{x:3,y:7},{x:2,y:7}]},
            p2:{name:'Opponent', score:0, alive:true, dir:{x:-1,y:0}, snake:[{x:15,y:12},{x:16,y:12},{x:17,y:12}]}
        };
    }

    function occupied(x,y,state) {
        return state.p1.snake.some(s=>s.x===x&&s.y===y) || state.p2.snake.some(s=>s.x===x&&s.y===y);
    }

    function spawnFood(state) {
        const spots=[];
        for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++) if(!occupied(x,y,state)) spots.push({x,y});
        state.food = spots[Math.floor(Math.random()*spots.length)] || {x:10,y:10};
    }

    function collidesWithBody(head, body, ignoreTail=false) {
        const max = ignoreTail ? Math.max(0, body.length-1) : body.length;
        for(let i=0;i<max;i++) if(head.x===body[i].x && head.y===body[i].y) return true;
        return false;
    }

    function validTurn(oldDir,newDir) {
        return !(oldDir.x + newDir.x === 0 && oldDir.y + newDir.y === 0) && !(newDir.x===0 && newDir.y===0);
    }

    function hostTick() {
        if (!running || !gameState) return;
        const a=gameState.p1, b=gameState.p2;
        if(validTurn(a.dir,hostDirection)) a.dir={...hostDirection};
        if(validTurn(b.dir,guestDirection)) b.dir={...guestDirection};

        // Wrap around the board instead of crashing into walls.
        const h1={
            x:(a.snake[0].x+a.dir.x+GRID)%GRID,
            y:(a.snake[0].y+a.dir.y+GRID)%GRID
        };
        const h2={
            x:(b.snake[0].x+b.dir.x+GRID)%GRID,
            y:(b.snake[0].y+b.dir.y+GRID)%GRID
        };

        const eat1=h1.x===gameState.food.x && h1.y===gameState.food.y;
        const eat2=h2.x===gameState.food.x && h2.y===gameState.food.y;

        // No crash on walls, self contact, opponent contact, or head-to-head contact.
        a.snake.unshift(h1);
        b.snake.unshift(h2);

        if(eat1) {
            a.score += 1;
            gameState.dotsCaptured += 1;
        } else {
            a.snake.pop();
        }

        if(eat2 && gameState.dotsCaptured < gameState.totalDots) {
            b.score += 1;
            gameState.dotsCaptured += 1;
        } else if(!eat2) {
            b.snake.pop();
        } else {
            // If the 50th dot was already awarded to Player 1 on the same tick,
            // Player 2 keeps normal length and no extra point is created.
            b.snake.pop();
        }

        a.alive=true;
        b.alive=true;

        if(gameState.dotsCaptured >= gameState.totalDots) {
            running=false;
            gameState.running=false;
            if(a.score>b.score) gameState.winner='p1';
            else if(b.score>a.score) gameState.winner='p2';
            else gameState.winner='draw';
        } else if(eat1 || eat2) {
            spawnFood(gameState);
        }

        renderState(gameState);
        send({type:'state', state:gameState});
        if(!running) announceEnd();
    }

    function renderState(state) {
        if (!state) return;
        p1ScoreEl.textContent=state.p1.score;
        p2ScoreEl.textContent=state.p2.score;
        p1NameEl.textContent=state.p1.name || 'Player 1';
        p2NameEl.textContent=state.p2.name || 'Player 2';

        ctx.fillStyle='#0F172A'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='rgba(255,255,255,.035)'; ctx.lineWidth=1;
        for(let i=0;i<=GRID;i++) {
            ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
        }
        ctx.fillStyle='#EF4444'; ctx.shadowBlur=12; ctx.shadowColor='#EF4444';
        ctx.beginPath(); ctx.arc(state.food.x*CELL+CELL/2,state.food.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        drawSnake(state.p1.snake,'#00C2A8','0,194,168');
        drawSnake(state.p2.snake,'#EC4899','236,72,153');
    }

    function drawSnake(snake, headColor, rgb) {
        snake.forEach((seg,i)=>{
            const alpha=Math.max(.28,1-i/(snake.length*1.4));
            ctx.fillStyle=i===0?headColor:`rgba(${rgb},${alpha})`;
            if(i===0){ctx.shadowBlur=14;ctx.shadowColor=headColor}else ctx.shadowBlur=0;
            const x=seg.x*CELL+1,y=seg.y*CELL+1,size=CELL-2;
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(x,y,size,size,i===0?6:3); else ctx.rect(x,y,size,size);
            ctx.fill();
        });
        ctx.shadowBlur=0;
    }

    function send(data) { if(conn && conn.open) conn.send(data); }

    function startMatch() {
        if(role!=='host' || !conn || !conn.open) return;
        clearInterval(loop);
        gameState=initialState();
        gameState.p2.name = conn.metadata?.name || 'Player 2';
        spawnFood(gameState);
        running=true;
        hostDirection={x:1,y:0}; guestDirection={x:-1,y:0};
        setStatus('2 players online · LIVE','#22C55E','#22C55E');
        hideOverlay();
        renderState(gameState);
        send({type:'start', state:gameState});
        loop=setInterval(hostTick,TICK);
    }

    function announceEnd() {
        if(!gameState) return;
        let title='Draw!';
        if(gameState.winner==='p1') title=(role==='host'?'You win!':'Opponent wins!');
        if(gameState.winner==='p2') title=(role==='guest'?'You win!':'Opponent wins!');
        showOverlay(title, `Final score ${gameState.p1.score} - ${gameState.p2.score}`, role==='host'?'Play Again':'Waiting for host...');
        if(role!=='host') actionBtn.classList.add('hidden');
    }

    function handleData(data) {
        if(!data || destroyed) return;
        if(role==='host') {
            if(data.type==='hello') {
                if(gameState) gameState.p2.name=data.name||'Player 2';
                p2NameEl.textContent=data.name||'Player 2';
                startMatch();
            } else if(data.type==='input' && validTurn(guestDirection,data.dir)) {
                guestDirection={...data.dir};
            } else if(data.type==='ready' && !running) startMatch();
        } else {
            if(data.type==='start') {
                gameState=data.state; running=true; hideOverlay();
                setStatus('2 players online · LIVE','#22C55E','#22C55E'); renderState(gameState);
            } else if(data.type==='state') {
                gameState=data.state; running=!!gameState.running; renderState(gameState);
                if(!running && gameState.winner) announceEnd();
            }
        }
    }

    function attachConnection(c) {
        conn=c;
        conn.on('open',()=>{
            if(role==='host') {
                p2NameEl.textContent=conn.metadata?.name || 'Player 2';
                setStatus('Opponent connected','#22C55E','#22C55E');
                startMatch();
            } else {
                send({type:'hello',name:playerName});
                setStatus('Connected · waiting for host','#22C55E','#22C55E');
            }
        });
        conn.on('data',handleData);
        conn.on('close',()=>opponentLeft());
        conn.on('error',()=>opponentLeft());
    }

    function opponentLeft() {
        if(destroyed) return;
        running=false; clearInterval(loop);
        setStatus('Opponent disconnected','#EF4444','#EF4444');
        showOverlay('Opponent left the match','This game is paused. Share/reopen the same room link to reconnect.');
        if(role==='host') p2NameEl.textContent='Disconnected'; else p1NameEl.textContent='Disconnected';
    }

    function becomeHost() {
        role='host';
        roleEl.textContent='Player 1 · Cyan';
        p1NameEl.textContent=playerName;
        setStatus('Waiting for Player 2','#F59E0B','#F59E0B');
        showOverlay('Waiting for Player 2','Send the invite link to another player. The game will start automatically when they join.');
        peer.on('connection',(incoming)=>{
            if(conn && conn.open) { incoming.on('open',()=>incoming.close()); return; }
            attachConnection(incoming);
        });
    }

    function becomeGuest() {
        role='guest';
        roleEl.textContent='Player 2 · Pink';
        p2NameEl.textContent=playerName;
        setStatus('Joining Player 1...','#F59E0B','#F59E0B');
        showOverlay('Joining Live Match','Connecting to Player 1...');
        attachConnection(peer.connect(hostPeerId,{reliable:true,metadata:{name:playerName}}));
    }

    function connectToRoom() {
        peer = new Peer(hostPeerId);
        let opened=false;
        peer.on('open',()=>{opened=true;becomeHost();});
        peer.on('error',(err)=>{
            if(destroyed) return;
            if(err && err.type==='unavailable-id' && !opened) {
                try{peer.destroy();}catch(_){ }
                peer=new Peer();
                peer.on('open',becomeGuest);
                peer.on('error',()=>{
                    setStatus('Connection failed','#EF4444','#EF4444');
                    showOverlay('Could not connect','Reload the page or create a new room link.','Reload');
                    actionBtn.onclick=()=>location.reload();
                });
            } else if(err && err.type!=='peer-unavailable') {
                console.warn('PeerJS:',err);
            }
        });
    }

    function setDirection(dir) {
        if(!running) return;
        if(role==='host') {
            if(validTurn(hostDirection,dir)) hostDirection={...dir};
        } else if(role==='guest') {
            if(validTurn(guestDirection,dir)) { guestDirection={...dir}; send({type:'input',dir:guestDirection}); }
        }
    }

    const keydownHandler=(e)=>{
        const map={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
        if(map[e.key]) { e.preventDefault(); setDirection(map[e.key]); }
    };
    document.addEventListener('keydown',keydownHandler);
    document.getElementById('btn-up').onclick=()=>setDirection({x:0,y:-1});
    document.getElementById('btn-down').onclick=()=>setDirection({x:0,y:1});
    document.getElementById('btn-left').onclick=()=>setDirection({x:-1,y:0});
    document.getElementById('btn-right').onclick=()=>setDirection({x:1,y:0});
    actionBtn.onclick=()=>{ if(role==='host') startMatch(); };

    // Draw an idle board while waiting.
    ctx.fillStyle='#0F172A'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(255,255,255,.035)';
    for(let i=0;i<=GRID;i++) { ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke(); }

    connectToRoom();

    const observer=new MutationObserver(()=>{
        if(!document.body.contains(canvas)) {
            destroyed=true; running=false; clearInterval(loop); document.removeEventListener('keydown',keydownHandler);
            try{if(conn)conn.close();}catch(_){ } try{if(peer)peer.destroy();}catch(_){ }
            observer.disconnect();
        }
    });
    observer.observe(document.getElementById('main-content'),{childList:true,subtree:true});
}

    function startActualGame() {

    function initPlayerSnake() {
        const canvas = document.getElementById('ts-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const gridSize = 17.5; // 350 / 20
        const tileCount = 20;
        
        let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = -1;
        let speed = 150 - (round * 20); // Faster each round
        let localPlayerAlive = true;

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    spawnFood();
                    return;
                }
            }
        }

        function drawGame() {
            if (!localPlayerAlive || !playerAlive || !document.getElementById('ts-canvas')) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                playerAlive = false;
                localPlayerAlive = false;
                return checkMatchEnd();
            }

            // Self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    playerAlive = false;
                    localPlayerAlive = false;
                    return checkMatchEnd();
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                myScore += 10;
                document.getElementById('ts-my-score').textContent = myScore;
                if (speed > 50) speed -= 2;
                spawnFood();
            } else {
                snake.pop();
            }

            ctx.fillStyle = '#0F172A'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for(let i=0; i<=tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            ctx.fillStyle = '#EF4444'; 
            ctx.shadowBlur = 10; ctx.shadowColor = '#EF4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            for (let i = 0; i < snake.length; i++) {
                let alpha = 1 - (i / (snake.length * 1.5));
                ctx.fillStyle = i === 0 ? '#00C2A8' : `rgba(0, 194, 168, ${alpha})`;
                if (i === 0) { ctx.shadowBlur = 15; ctx.shadowColor = '#00C2A8'; } 
                else { ctx.shadowBlur = 0; }

                const x = snake[i].x * gridSize;
                const y = snake[i].y * gridSize;
                const size = gridSize - 1;
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x, y, size, size, i === 0 ? 4 : 2);
                else ctx.rect(x, y, size, size);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            gameLoop = setTimeout(drawGame, speed);
        }

        drawGame();

        function setDirection(newDx, newDy) {
            if (dx === 0 && newDx !== 0) { dx = newDx; dy = 0; } 
            else if (dy === 0 && newDy !== 0) { dx = 0; dy = newDy; }
        }

        const keydownHandler = (e) => {
            if (!playerAlive) return;
            if (['ArrowUp', 'w', 'W'].includes(e.key)) { e.preventDefault(); setDirection(0, -1); }
            if (['ArrowDown', 's', 'S'].includes(e.key)) { e.preventDefault(); setDirection(0, 1); }
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) { e.preventDefault(); setDirection(-1, 0); }
            if (['ArrowRight', 'd', 'D'].includes(e.key)) { e.preventDefault(); setDirection(1, 0); }
        };
        document.addEventListener('keydown', keydownHandler);

        // Cleanup
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.removedNodes) {
                    mutation.removedNodes.forEach((node) => {
                        if (node.contains && node.contains(canvas)) {
                            clearTimeout(gameLoop);
                            clearInterval(cpuInterval);
                            document.removeEventListener('keydown', keydownHandler);
                            observer.disconnect();
                        }
                    });
                }
            });
        });
        observer.observe(document.getElementById('ts-container'), { childList: true });
    }

    function checkMatchEnd() {
        if (!playerAlive || !cpuAlive) {
            clearInterval(cpuInterval);
            clearTimeout(gameLoop);
            const overlay = document.getElementById('ts-match-overlay');
            const msg = document.getElementById('ts-match-msg');
            const sub = document.getElementById('ts-match-sub');
            
            overlay.classList.remove('opacity-0', 'pointer-events-none');

                sub.textContent = 'Eliminated from Tournament';
                setTimeout(() => {

            } else if (!cpuAlive) {
                msg.textContent = 'OPPONENT CRASHED';
                msg.className = 'text-6xl font-black text-success mb-8';
                sub.textContent = 'You Win! Advancing...';
                setTimeout(() => {
                    if (round === 3) {
                        state = 'CHAMPION';
                    } else {
                        state = 'WAITING';
                    }
                    render();
                }, 3000);
            }
        }
    }

    function renderWaiting() {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full max-w-2xl mx-auto text-center animate-fade-in">
